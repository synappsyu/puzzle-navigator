          if (w !== y) { const j = w * SIZE + x; sp[j] = sp[i]; lv[j] = lv[i]; id[j] = id[i]; ch[j] = 1; }
          w++;
        }
      }
      for (let y = w; y < SIZE; y++) { const j = y * SIZE + x; sp[j] = -1; lv[j] = 0; id[j] = -1; ch[j] = 1; }
    }
  }

  let found = false, timedOut = false, nodes = 0;
  let best = null, bestLen = 0, bestRecOk = false;
  const colors = [];          // 補充された駒の色(補充された順)。-1 = まだ未定
  const seen = new Set();

  // 1回の補充から、次の補充の前まで
  // chg … 前の回のあとで変わったマス(マッチした・詰めて動いた。最初の回は null = 全部変わった扱い)
  function wave(sp, lv, id, round, recSoFar, chg) {
    if (found || timedOut) return;
    if ((++nodes & 63) === 0 && performance.now() - t0 > timeLimit) { timedOut = true; return; }
    // 空いたマスに未定の駒を入れる(番号は補充される順 = 行の若い順・列の若い順)
    const changed = chg ? chg.slice() : new Uint8Array(N).fill(1);
    for (let i = 0; i < N; i++) if (sp[i] < 0) { changed[i] = 1; sp[i] = UNK; lv[i] = 1; id[i] = colors.length; colors.push(-1); }
    // 同じ盤面を2度調べないための鍵。それまでに決めた補充の色(colors)も入れる。入れないと、つじつまの合わない色の決め方で
    // 先にこの盤面に来た道(最後の打ち直しで合わずに捨てられる)のせいで、本当の色の決め方で来た道が飛ばされ、正しい盤面を「ありえない」と言ってしまう
    const key = Array.prototype.join.call(sp, '') + '|' + Array.prototype.join.call(lv, '') + '|' + Array.prototype.map.call(id, v => (v >= 0 && colors[v] < 0 ? 1 : 0)).join('') + '|' + round + '|' + recSoFar + '|' + colors.join(',');
    if (seen.has(key)) return;
    seen.add(key);
    const wild = [];
    for (let i = 0; i < N; i++) if (sp[i] === UNK && id[i] >= 0) wild.push(i);
    // 新しいマッチは、必ず変わったマス(補充された・動いた・マッチでできた)を含む
    // (変わっていないマスだけの並びなら、前の回にマッチしていたはず)

    // (1) ここで止まる: 未定の駒は全部マッチせず、入力した色のまま残る
    if (!detectRuns(sp, lv, ml).length && region) {
      // 変わりうるマスを集めるとき: 増えた手数が合う止まり方で、示した盤面から変わっているマスを数える(入力した盤面とは比べない)
      if (recOk(recSoFar)) for (let i = 0; i < N; i++) {
        const a = shown[Math.floor(i / SIZE)][i % SIZE];
        if (!a || a.species === '?' || touched[i]) continue;
        if (sp[i] === UNK || sp[i] !== SPECIES_INDEX[a.species] || lv[i] !== a.level) region.add(i);
      }
    } else if (!detectRuns(sp, lv, ml).length) {
      const s2 = sp.slice(), l2 = lv.slice();
      const d = [];
      let fixable = true;
      for (let i = 0; i < N; i++) {
        if (sp[i] === UNK && id[i] >= 0) {
          if (fsp[i] === -2) continue;
          if (flv[i] !== refillLevelOf(fsp[i])) { d.push(i); fixable = false; continue; }
          s2[i] = fsp[i]; l2[i] = flv[i];
        } else if (sp[i] === UNK) { /* 前から残っている「?」: 何を入力してもよい */ }
        else if (fsp[i] !== -2 && (sp[i] !== fsp[i] || lv[i] !== flv[i])) d.push(i);
      }
      const ro = recOk(recSoFar);
      if (d.length === 0 && ro) {
        // 未定の駒の色を入力した盤面の色に決めて、本当の計算で打ち直す
        const saved = colors.slice();
        for (const i of wild) if (colors[id[i]] < 0) colors[id[i]] = fsp[i] >= 0 ? fsp[i] : -1;
        // 入力した盤面で「?」のままのマスに残った駒は、「?」(どの駒ともマッチしない駒)として打ち直す。
        // (並びを作らない色を全部の組み合わせで探すと、「?」が多いときに終わらないため)
        for (const i of wild) if (fsp[i] < 0) colors[id[i]] = UNK;
        if (fixable && replay(colors.map(c => (c < 0 ? 0 : c)))) { found = true; return; }
        for (let k = 0; k < colors.length; k++) colors[k] = saved[k];
      }
      // いちばん近い盤面が何通りもあるときは、違うマスを全部まとめて示す(どれが本当に違うかは分からないので)
      const cost = costOf(d);
      if (!best || (ro && !bestRecOk) || (ro === bestRecOk && cost < bestLen)) { best = new Set(d); bestLen = cost; bestRecOk = ro; }
      else if (ro === bestRecOk && cost === bestLen) for (const i of d) best.add(i);
    }
    // (2) この回にマッチが起きる: 未定の駒ごとに「マッチしない」か「この色でマッチに入る」かを選ぶ
    const w = recoveryWeight(round);
    if (!recRoom(recSoFar + w) || round > 30) return;
    const s2 = sp.slice(), l2 = lv.slice();
    const decided = new Uint8Array(N);   // 1 = この回の選び方を決めた
    // 色 v の駒をマス i に置いたとき、縦か横に3つ並ぶ見込みがあるか(まだ決めていない未定の駒は、何色にもなれるとみなす)
    function canRun(i, v, l) {
      const x = i % SIZE, y = Math.floor(i / SIZE);
      const ok = (xx, yy) => {
        if (xx < 0 || yy < 0 || xx >= SIZE || yy >= SIZE) return false;
        const q = yy * SIZE + xx;
        if (q === i) return true;
        if (s2[q] === UNK && id[q] >= 0 && !decided[q]) return true;
        return s2[q] === v && l2[q] === l;
      };
      const ch = (xx, yy) => changed[yy * SIZE + xx];
      // i を含む3つ並び(横3通り・縦3通り)のどれかが、全部そろう見込みがあり、変わったマスを含むこと
      for (let o = -2; o <= 0; o++) {
        if (ok(x + o, y) && ok(x + o + 1, y) && ok(x + o + 2, y) && (ch(x + o, y) || ch(x + o + 1, y) || ch(x + o + 2, y))) return true;
        if (ok(x, y + o) && ok(x, y + o + 1) && ok(x, y + o + 2) && (ch(x, y + o) || ch(x, y + o + 1) || ch(x, y + o + 2))) return true;
      }
      return false;
    }
    function pick(j) {
      if (found || timedOut) return;
      if ((++nodes & 1023) === 0 && performance.now() - t0 > timeLimit) { timedOut = true; return; }
      if (j === wild.length) {
        const runs = detectRuns(s2, l2, ml);
        if (!runs.length) return;
        // 色を選んだ駒は、どれかの並びに入っていること(入っていなければ「マッチしない」と同じなので重複)
        const inRun = new Uint8Array(N);
        for (const r of runs) for (const c of r.cells) inRun[c] = 1;
        for (const i of wild) if (s2[i] !== UNK && !inRun[i]) return;
        for (const r of runs) if (!r.cells.some(c => changed[c])) return;
        const add = runs.length * w;
        if (!recRoom(recSoFar + add)) return;
        const saved = [];
        for (const i of wild) if (s2[i] !== UNK) { saved.push(id[i]); colors[id[i]] = s2[i]; }
        const s3 = s2.slice(), l3 = l2.slice(), id3 = id.slice();
        const ch3 = new Uint8Array(N);
        for (const r of runs) for (const c of r.cells) ch3[c] = 1;
        if (runs.length > 1) runs.sort((a, b) => (b.len - a.len) || (a.ord - b.ord));
        const ov = new Uint8Array(N);
        for (const r of runs) mergeRunStandard(r, l3, ov);
        // 色が決まった駒は、もう未定ではない
        for (const i of wild) if (s3[i] !== UNK) id3[i] = -1;
        compactWithId(s3, l3, id3, ch3);
        const len = colors.length;
        wave(s3, l3, id3, round + 1, recSoFar + add, ch3);
        colors.length = len;
        for (const k of saved) colors[k] = -1;
        return;
      }
      const i = wild[j];
      decided[i] = 1;
      s2[i] = UNK; l2[i] = 1;
      pick(j + 1);
      for (let v = 0; v < 4 && !found && !timedOut; v++) {
        const l = refillLevelOf(v);
        if (!canRun(i, v, l)) continue;
        s2[i] = v; l2[i] = l;
        pick(j + 1);
      }
      s2[i] = UNK; l2[i] = 1;
      decided[i] = 0;
    }
    pick(0);
  }

  const sp = new Int8Array(N), lv = new Int8Array(N), id = new Int16Array(N).fill(-1);
  flatFromGrid(before, sp, lv);
  let firstRound;   // 補充の後の最初のマッチが、何ラウンド目か(増える手数の数え方に使う)
  if (move.type === 'swap') {
    const m = applySwapFlat(sp, lv, move.a.y * SIZE + move.a.x, move.b.y * SIZE + move.b.x, ml, 1, null);
    if (!m.hadMatches) {
      // マッチしない入替: 補充も連鎖も無い
      const d = [];
      for (let i = 0; i < N; i++) if (fsp[i] !== -2 && sp[i] !== UNK && (sp[i] !== fsp[i] || lv[i] !== flv[i])) d.push(i);
      const ro = recOk(0);
      return { ok: d.length === 0 && ro, timedOut: false, reason: d.length ? 'board' : 'rec', diff: d };
    }
    firstRound = 2;
  } else {
    const i = move.pos.y * SIZE + move.pos.x;
    sp[i] = -1; lv[i] = 0;
    compactFlat(sp, lv);
    firstRound = 1;
  }
  wave(sp, lv, id, firstRound, 0);
  return { ok: found, timedOut, reason: found ? '' : (bestRecOk ? 'board' : 'rec'), diff: best ? Array.from(best).sort((a, b) => a - b) : [], region: region ? Array.from(region).sort((a, b) => a - b) : null, nodes };
}
// 盤面に、まだ3つ以上そろっている並び(マッチするはずの並び)があれば、その並びの先頭のマスを返す
function boardRuns(grid) {
  const sp = new Int8Array(SIZE * SIZE), lv = new Int8Array(SIZE * SIZE);
  flatFromGrid(grid, sp, lv);
  return detectRuns(sp, lv, maxLevelsToIdx(state.maxLevels)).map(r => ({ x: r.cells[0] % SIZE, y: Math.floor(r.cells[0] / SIZE), len: r.len }));
}
// 「最後の盤面だけ」で確定する。連鎖で増えた手数は、入力された残り手数から逆算する。
function commitFinal(leftAfter) {
  const g = state.game, p = g.pending;
  let chain = leftAfter - (currentLeft() - 1), adjust = 0;
  if (chain < 0) { adjust = chain; chain = 0; }   // 計算より少ない数字で確定したときは、連鎖による増加ではなく手数の直しとして数える
  g.log.push(withMoveSrc({ move: p.move, before: p.before, after: cloneGrid(state.board), refills: [], chain, events: p.events, inputMode: 'final', queueBefore: p.queueBefore }));
  if (adjust) g.log[g.log.length - 1].adjust = adjust;
  movePinsAfter(g.log[g.log.length - 1]);
  advanceTargetAfterMove(g.log[g.log.length - 1]);
  g.pending = null;
  g.phase = 'move';
  clearChainResults();   // 補充の入力中に残していた、打つ前の盤面のカードを消す
  refresh();
  autoSearchAfterMove();
}
// 入力間違いの確認の結果がどの盤面・残り手数に対するものか(入力し直すか数字を変えたら、もう一度調べる)
function finalCheckKey(v) { return JSON.stringify(state.board) + '|' + v; }
// 確定を押したときの入力間違いの確認。ありえる盤面なら onPass で確定する。
// ありえないときは止めて、違うマスに赤い枠をつける(同じ盤面・数字のままもう一度押せば確定)
function runFinalCheck(p, v, keepUnknown, key, onPass) {
  const min = currentLeft() - 1;
  const painted = cloneGrid(state.board);
  if (keepUnknown) fillEmptyAsUnknown(painted);
  // 計算より少ない数字(手数の直し)のときは、増えた手数は分からないものとして、盤面だけを確かめる
  const rec = v >= min ? v - min : null, room = recoveryRoom();
  // PvPで手数の上限に届いたときは、それ以上増えないので「これ以上」として調べる
  const atLeast = rec != null && rec >= room;
  const r = checkPaintedBoard(p.before, p.move, painted, rec, atLeast, { timeLimitMs: 1000, shown: p.shown });
  p.checkKey = key;
  const expected = min + Math.min(p.sureChain, room);
  if (r.ok || (r.timedOut && v <= expected)) { p.checkMarks = null; p.checkMsg = ''; onPass(); return; }
  if (r.timedOut) {
    p.checkMarks = null;
    p.checkMsg = '大きな連鎖なので、入力が正しいかをツールで確かめきれませんでした。入力された残り手数が計算より多いので、補充された駒でもマッチが起きたはずです。そのマッチで「?」以外のマスも変わっていることがあるので、ゲーム画面と見比べてください。このままでよければ、もう一度「確定」を押してください。';
  } else {
    // 赤い枠: いちばん近いありえる盤面と違うマス + 手をつけていないマスのうち、この手で変わりえたマス(入力し直し忘れは必ずこの中にある)
    const rg = checkPaintedBoard(p.before, p.move, painted, rec, atLeast, { timeLimitMs: 500, shown: p.shown, region: true });
    const marks = new Set(r.diff);
    if (rg.region) for (const i of rg.region) marks.add(i);
    p.checkMarks = marks.size ? Array.from(marks) : null;
    p.checkMsg = marks.size
      ? `この手を打っても、${rec == null ? 'この盤面' : 'この盤面と残り手数'}にはなりません。赤い点線の枠のマス（${marks.size}マス）をゲーム画面と見比べてください。今の盤面がゲーム画面どおりなら、そのまま「確定」を押して進めて大丈夫です（前の手の入力違いが、影響した可能性があります）。`
      : 'この盤面の場合、残り手数が合いません。残り手数と盤面を、ゲーム画面と見比べてください。このままでよければ、もう一度「確定」を押してください。';
  }
  p.checkConfirm = true;
  refresh();
}
function renderFinalControls(p) {
  const g = state.game;
  const n = pendingInputCount(p);
  const expected = currentLeft() - 1 + Math.min(p.sureChain, recoveryRoom());
  const shown = p.enteredLeft != null ? p.enteredLeft : expected;
  const runs = n ? [] : boardRuns(state.board);
  const runText = runs.map(r => `列${r.x + 1}・行${r.y + 1}から${r.len}個`).join('、');
  gameControlsEl.innerHTML = `
    <div class="moves-left">残り手数 <span class="num">${expected}</span><span class="note">（目安）</span></div>
    <div class="game-status">${n
      ? 'マッチが止まった後の盤面と残り手数を、ゲーム画面に合わせてください。'
      : '残り手数がゲーム画面と同じか確かめて、「確定」を押してください。'}
      ${runs.length ? `<br><b style="color:var(--danger)">まだ3つ以上そろっている並びがあります（${runText}）。ゲーム画面ではマッチしているはずなので、入力間違いがないか確かめてください。${p.confirmRuns ? 'このままでよければ、もう一度「確定」を押してください。' : ''}</b>` : ''}
      ${p.checkMsg && p.checkKey === finalCheckKey(shown) ? `<br><b style="color:var(--danger)">${p.checkMsg}</b>` : ''}
      ${moveNotice ? `<br><b style="color:var(--danger)">${moveNotice}</b>` : ''}</div>
    <div class="toolbar" style="margin-top:0;margin-bottom:8px;align-items:center;">
      <label class="small">残り手数 <input type="number" id="finalLeftInput" min="0" max="999" inputmode="numeric" enterkeyhint="done" value="${shown}" style="width:5em;"></label>
      ${boardReadButtonHtml()}
      <button id="btnFinalCommit" class="primary" ${n ? 'disabled' : ''}>確定</button>
      ${n ? '<button id="btnFinalKeep">「?」のまま確定</button>' : ''}
      <button id="btnFixCancel" class="danger">この手を取り消す</button>
    </div>`;
  bindBoardReadButton();
  document.getElementById('finalLeftInput').addEventListener('input', (e) => { const v = parseInt(e.target.value, 10); p.enteredLeft = isNaN(v) ? null : v; p.confirmLow = false; saveState(); });
  const finalCommit = (keepUnknown) => {
    if (p.checking) return;
    const v = parseInt(document.getElementById('finalLeftInput').value, 10);
    const min = currentLeft() - 1;
    if (isNaN(v) || v < 0) { moveNotice = '残り手数を入れてください。'; refresh(); return; }
    // 計算より少ない数字は打ち間違いのことが多いので、1回だけ確かめる(もう一度押せばその数字で確定し、差は手数の直しとして数える)
    if (v < min && !p.confirmLow) { p.confirmLow = true; moveNotice = `計算（${min}）より${min - v}手少ないです。このままでよければ、もう一度「確定」を押してください。`; refresh(); return; }
    // 「?」のまま確定: 未入力のマスも「?」にして、そのまま次の手へ
    const finish = () => { if (keepUnknown) fillEmptyAsUnknown(state.board); commitFinal(v); };
    if (!keepUnknown && boardRuns(state.board).length) {
      if (!p.confirmRuns) { p.confirmRuns = true; refresh(); return; }
      finish(); return;
    }
    // 入力間違いの確認: 入力した盤面と残り手数が、この手を打ってありえるか(計算より少ない数字=手数の直しのときは、盤面だけを確かめる)
    const key = finalCheckKey(v);
    if (!(p.checkKey === key && p.checkConfirm)) {
      p.checking = true; moveNotice = '確かめています…'; refresh();
      setTimeout(() => { p.checking = false; runFinalCheck(p, v, keepUnknown, key, finish); }, 20);
      return;
    }
    finish();
  };
  document.getElementById('btnFinalCommit').addEventListener('click', () => finalCommit(false));
  // 残り手数の欄で Enter(スマホのキーボードの「完了」)を押しても確定する。入力が残っているときは何もしない
  document.getElementById('finalLeftInput').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    if (!n) finalCommit(false);
  });
  const keepBtn = document.getElementById('btnFinalKeep');
  if (keepBtn) keepBtn.addEventListener('click', () => finalCommit(true));
  document.getElementById('btnFixCancel').addEventListener('click', undoLast);
}
// 「?」を埋め終えたら呼ぶ。マッチが起きれば1ラウンド進めて、また「?」を聞く。止まったら手を確定する。
// allowUnknown === true なら、「?」を埋めずにそのまま進む
function resolveAfterFix(allowUnknown) {
  const g = state.game, p = g.pending;
  if (!p || p.mode === 'final') return;
  if (allowUnknown === true) fillEmptyAsUnknown(state.board);
  else if (pendingInputCount(p) > 0) return;
  for (const s of p.slots) {
    const c = state.board[s.y][s.x];
    if (c && c.species !== '?') p.refills.push({ x: s.x, y: s.y, species: c.species, level: c.level, wave: p.wave });
  }
  p.slots = [];
  const r = resolveOneRound(cloneGrid(state.board));
  if (r.rounds > 0) {
    p.rounds++;
    // 1手の中で何回目のマッチか。入替は入替で直接そろったマッチがラウンド1なので、このあとのマッチはラウンド2から。
    // 削除は、削除のあと最初のマッチがラウンド1(手数は戻らない)。
    const round = p.move.type === 'delete' ? p.rounds : p.rounds + 1;
    p.chain += r.matches * recoveryWeight(round);
    p.events = p.events.concat(r.events);
    p.wave++;
    p.slots = r.slots;
    state.board = r.grid;
    refresh();
    return;
  }
  commitMove();
}
// sureLoss: 連鎖の一覧の、補充が来なかったときだけ素材が減る連鎖のとき、その量(補充を入れた平均では減らないので、「必ず崩れる」とは書かない)

    <p style="font-size:15px;"><b>${pathLen > 1 ? `この${pathLen}手の手順（1手目: ${describeMove(move)}）` : describeMove(move)}</b></p>

    if (!c || c.species !== p.species) return;

    else have[c.level] = (have[c.level] || 0) + 1;

// 探す手数の選択肢に、かかる時間の目安を出す(2026-10-03 手分けの後、このパソコンのブラウザで熟練者の記録4場面を測った時間。斜めなし 3手0.2〜0.4秒・4手1〜2秒(カードの計算と表示を入れると3秒ほど。本人の印象も3秒)、斜めあり 3手0.3〜0.6秒・4手5〜11秒)
function updateDepthLabels() {

function refresh() {

/* ---------- 操作 ---------- */
function paintCell(x, y) {
  const g = state.game;
  if (g.phase === 'move' && g.future.length) { withFutureDropped(() => paintCell(x, y)); return; }
  const cur = state.board[y][x];
  // 「?」: 入力を省くマスにする(どの駒ともマッチしない)
  if (brush.erase) {
    if (cur && cur.species === '?') return;
    state.board[y][x] = { species: '?', level: 1 };
    if (g.phase === 'move') g.queue = [];
    onBoardChanged();
    return;
  }
  // 「?」のマスも選んでいるレベルで入れる(補充された駒がマッチしてLv2以上になっていることがあるため)
  let level = brush.level;
  if (level < minBoardLevelOf(brush.species)) level = minBoardLevelOf(brush.species);
  if (level > (state.maxLevels[brush.species] || 7)) level = state.maxLevels[brush.species] || 7;
  if (cur && cur.species === brush.species && cur.level === level) return;
  state.board[y][x] = { species: brush.species, level };
  if (g.phase === 'move') g.queue = [];
  onBoardChanged();
}
function onBoardCellClick(x, y) {
  const g = state.game;
  if (Date.now() < suppressClickUntil) return;   // ドラッグ・長押しで手を打った指を離したときのクリック
  if (anim) { finishAnim(); return; }
  if (g.phase === 'setup' || g.phase === 'fix' || moveMode === 'edit') { paintCell(x, y); return; }
  if (moveMode === 'delete') { deleteAt(x, y); return; }
  if (moveMode === 'pin') { togglePin(x, y); return; }
  if (!picked) { picked = { x, y }; refresh(); return; }
  if (picked.x === x && picked.y === y) { picked = null; refresh(); return; }
  if (!isNeighbor(picked, { x, y })) { picked = { x, y }; refresh(); return; }
  const a = picked;
  picked = null;
  playMove({ type: 'swap', a, b: { x, y } });
}
// 削除を打つ(マスを押す・長押し)。MAXの駒を削除するときは、打ち間違いでないか一度確かめる
function deleteAt(x, y) {
  const c = state.board[y][x];
  if (c && SPECIES.includes(c.species) && c.level >= (state.maxLevels[c.species] || 7)) {
    openAsk(`（列${x + 1}・行${y + 1}）の${pieceLabel(c.species, c.level)}はMAXの駒です。削除すると、このMAXはなくなります。削除しますか？`, {
      okLabel: '削除する', danger: true,
      onOk: () => playMove({ type: 'delete', pos: { x, y } }),
      onCancel: () => { picked = null; refresh(); },
    });
    return;
  }
  playMove({ type: 'delete', pos: { x, y } });
}

/* ---------- ドラッグで入替・長押しで削除(手を打っている間だけ。「盤面を直す」のときは使わない) ---------- */
// ドラッグ: 駒が指に付いて動き(となりのマスまで)、動かした向きのとなりと入れ替わる。指を離したときに決まり、元のマスで離せば取りやめ。
// 長押し: 動かさずに押し続けると、LONG_GLOW で光り始めて LONG_DELETE で削除する(離すのを待たない)。それより前に離せば何も起きない。
// 打つ手は、マスを押して打つときと同じ(事故の警告・MAXの駒の確認なども同じ)。
const LONG_DELETE = 2000, LONG_GLOW = Math.round(LONG_DELETE / 3);
let press = null;              // 押している間: { x, y, x0, y0, id, dragging, done, target, pieceEl, cx, cy, t1, t2 }
let suppressClickUntil = 0;    // ドラッグ・長押しのあと、指を離したときに起きるクリックを無視する時刻
const boardCell = (x, y) => boardEl.children[y * SIZE + x];
function boardPitch() { return boardEl.getBoundingClientRect().width / SIZE; }
function cellAtPoint(ev) {
  const r = boardEl.getBoundingClientRect();
  const x = Math.floor((ev.clientX - r.left) / (r.width / SIZE)), y = Math.floor((ev.clientY - r.top) / (r.height / SIZE));
  return x >= 0 && x < SIZE && y >= 0 && y < SIZE ? { x, y } : null;
}
// 指を動かした向きのとなり(上下左右。斜め入替ありなら斜めも)。動かした量が駒の3分の2より小さければ null
// (2026-09-26 本人: 3分の1では実機より軽すぎる)
function dragTargetOf(dx, dy) {
  if (Math.hypot(dx, dy) < boardPitch() * 2 / 3) return null;
  let sx = 0, sy = 0;
  if (state.diagonal) {
    const k = Math.round(Math.atan2(dy, dx) / (Math.PI / 4));
    sx = Math.round(Math.cos(k * Math.PI / 4)); sy = Math.round(Math.sin(k * Math.PI / 4));
  } else if (Math.abs(dx) >= Math.abs(dy)) sx = Math.sign(dx); else sy = Math.sign(dy);
  const x = press.x + sx, y = press.y + sy;
  return x >= 0 && x < SIZE && y >= 0 && y < SIZE ? { x, y } : null;
}
function clearPressTimers() { if (press) { clearTimeout(press.t1); clearTimeout(press.t2); } }
boardEl.addEventListener('contextmenu', (e) => { if (boardEl.classList.contains('play')) e.preventDefault(); });
boardEl.addEventListener('pointerdown', (ev) => {
  if (press) endPress(null, true);   // 前の押し方が終わっていなければ(小窓の上で指を離したなど)、取りやめにする
  // 「ピン」のとき: ピンの駒をドラッグして、離したマスを行き先にする(押すだけならクリックでピンの付け外し)
  if (!anim && moveMode === 'pin' && state.game.phase === 'move' && !(ev.pointerType === 'mouse' && ev.button !== 0)) {
    const p = cellAtPoint(ev);
    // ピンの駒からなら、その駒の行き先を付ける・付け替える。行き先のマス(ピンの駒ではない)からなら、その行き先を移す
    const i = p ? p.y * SIZE + p.x : -1;
    const from = i < 0 ? -1 : currentPins().includes(i) ? i : pinWithDestAt(i);
    if (from >= 0) press = { pinDrag: true, from, x: p.x, y: p.y, x0: ev.clientX, y0: ev.clientY, id: ev.pointerId, dragging: false, done: false, target: null };
    return;
  }
  if (anim || !boardEl.classList.contains('play') || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
  const p = cellAtPoint(ev);
  if (!p) return;
  press = { x: p.x, y: p.y, x0: ev.clientX, y0: ev.clientY, id: ev.pointerId, dragging: false, done: false, target: null };
  press.t1 = setTimeout(() => { if (press && !press.dragging) boardCell(press.x, press.y).classList.add('press-glow'); }, LONG_GLOW);
  press.t2 = setTimeout(() => {
    if (!press || press.dragging) return;
    press.done = true;
    const { x, y } = press;
    boardCell(x, y).classList.remove('press-glow');
    picked = null;
    deleteAt(x, y);
  }, LONG_DELETE);
});
// 動かす・離すは盤面の外や小窓の上でも起きるので、画面全体で受ける
window.addEventListener('pointermove', (ev) => {
  if (!press || press.done || ev.pointerId !== press.id) return;
  const dx = ev.clientX - press.x0, dy = ev.clientY - press.y0, pitch = boardPitch();
  if (press.pinDrag) {
    if (!press.dragging) {
      if (Math.hypot(dx, dy) < pitch / 2) return;
      press.dragging = true;
      try { boardEl.setPointerCapture(ev.pointerId); } catch (e) { /* 取れなくても動く */ }
    }
    const c = cellAtPoint(ev);
    const t = c && !(c.x === press.x && c.y === press.y) ? c : null;
    if (press.target) boardCell(press.target.x, press.target.y).classList.remove('dest-hover');
    press.target = t;
    if (t) boardCell(t.x, t.y).classList.add('dest-hover');
    return;
  }
  if (!press.dragging) {
    if (Math.hypot(dx, dy) < pitch / 2) return;   // 駒の半分より小さい指の動きは長押しのまま(駒は動かさない)
    clearPressTimers();
    press.dragging = true;
    try { boardEl.setPointerCapture(ev.pointerId); } catch (e) { /* 取れなくても動く */ }
    // 押す打ち方で1マス目を選んでいたら、選ぶのをやめる
    if (picked) { const pc = boardCell(picked.x, picked.y); if (pc) pc.classList.remove('highlight'); picked = null; }
    const src = boardCell(press.x, press.y), c = state.board[press.y][press.x];
    src.classList.remove('press-glow');
    const r = src.getBoundingClientRect();
    const piece = document.createElement('div');
    piece.className = 'drag-piece';
    piece.style.width = r.width + 'px'; piece.style.height = r.height + 'px';
    piece.style.background = src.style.background || '#fffdf9'; piece.style.color = src.style.color || '#9c90b8';
    piece.textContent = src.classList.contains('char') ? '' : c && c.species !== '?' ? `${c.species}${c.level}` : '?';
    document.body.appendChild(piece);
    press.pieceEl = piece; press.cx = r.left + r.width / 2; press.cy = r.top + r.height / 2;
    src.classList.add('drag-origin');
  }
  press.pieceEl.style.left = (press.cx + Math.max(-pitch, Math.min(pitch, dx))) + 'px';
  press.pieceEl.style.top = (press.cy + Math.max(-pitch, Math.min(pitch, dy))) + 'px';
  // 盤面の外で指を離すと: 左端の列・一番上の行・右端の列の駒は削除(下の外は除く)。それ以外は取りやめ(入替もしない)
  const br = boardEl.getBoundingClientRect();
  const outside = ev.clientX < br.left || ev.clientX > br.right || ev.clientY < br.top || ev.clientY > br.bottom;
  press.outDelete = outside && ev.clientY <= br.bottom && (press.x === 0 || press.x === SIZE - 1 || press.y === 0);
  press.pieceEl.classList.toggle('drag-delete', press.outDelete);
  const t = outside ? null : dragTargetOf(dx, dy);
  const same = (a, b) => (a && b ? a.x === b.x && a.y === b.y : a === b);
  if (!same(t, press.target)) {
    if (press.target) boardCell(press.target.x, press.target.y).classList.remove('highlight');
    press.target = t;
    if (t) boardCell(t.x, t.y).classList.add('highlight');
  }
});
function endPress(ev, cancelled) {
  if (!press || (ev && ev.pointerId !== press.id)) return;
  clearPressTimers();
  const p = press;
  press = null;
  if (p.pieceEl) p.pieceEl.remove();
  if (p.dragging || p.done) suppressClickUntil = Date.now() + 400;
  if (p.pinDrag) {
    // 押して離しただけなら何もしない(そのあとのクリックでピンを外す。ここで盤面を描き直すと、クリックが届かなくなる)
    if (!p.dragging) return;
    if (p.target && !cancelled) setPinDest(p.from, p.target.y * SIZE + p.target.x);
    else renderBoard();   // 取りやめ: 行き先の候補の枠を消す
    return;
  }
  if (p.dragging) {
    if (p.outDelete && !cancelled) { renderBoard(); picked = null; deleteAt(p.x, p.y); return; }
    if (p.target && !cancelled) { playMove({ type: 'swap', a: { x: p.x, y: p.y }, b: p.target }); return; }
    renderBoard();   // 取りやめ: 暗くしたマスと赤い枠を戻す
    return;
  }
  if (!p.done) { const c = boardCell(p.x, p.y); if (c) c.classList.remove('press-glow'); }
}
window.addEventListener('pointerup', (ev) => endPress(ev, false));
window.addEventListener('pointercancel', (ev) => endPress(ev, true));

// 素材とレベルの欄で素材を選ぶ。別の素材に変えたときは、レベルをその素材の最低レベル(補充がLv2の素材はLv2)に戻す
function selectBrushSpecies(sp) {
  if (brush.species !== sp) brush.level = minBoardLevelOf(sp);
  brush.species = sp;
  brush.erase = false;
}
brushRowEl.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.erase) brush.erase = true;
  if (b.dataset.sp) selectBrushSpecies(b.dataset.sp);
  if (b.dataset.lv && !b.disabled) { brush.level = +b.dataset.lv; brush.erase = false; }
  renderBrushRow();
});

    mk('レベル−1', 'MAX布陣の全部のマスのレベルを1つ下げます（下限はLv1）。', () => { p.cells = shiftPatternLevels(p.cells, -1, state.maxLevels[p.species] || 7); changed(); });

// 左右反転: 盤面の中央線で折り返す(5列しか使わない3MAXは、右寄せなら左寄せになる)
function mirrorPatternCells(cells) {
  return cells.map(row => row.slice().reverse());
}
// 全部のマスのレベルを d だけ動かす(1〜最大レベルの範囲に収める)
function shiftPatternLevels(cells, d, maxLv) {
  return cells.map(row => row.map(v => (v === 'X' ? v : Math.max(1, Math.min(maxLv, v + d)))));
}

/* ============================== 確認・お知らせの小窓 ============================== */
// opts: okLabel / cancelLabel(null ならお知らせで、ボタンは1つ)/ danger(はいのボタンを赤に)/ onOk / onCancel
// 文は「ただの文字」として出す(名前などに画面の部品の記号が入っていても、そのまま表示する)
function openAsk(message, opts = {}) {
  const notice = opts.cancelLabel === null;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  const modal = document.createElement('div');
  modal.className = 'modal ask';   // 確かめとお知らせの短い画面。右上の ✕ は付けない(どちらかを選んでもらう)
  modal.style.maxWidth = '420px';
  const p = document.createElement('p');
  p.className = 'ask-text';
  p.style.margin = '0';
  p.textContent = message;
  modal.appendChild(p);
  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  let done = false;
  const finish = (ok) => {
    if (done) return;
    done = true;
    overlay.remove();
    const fn = ok ? opts.onOk : opts.onCancel;
    if (fn) fn();
  };
  if (!notice) {
    const cancel = document.createElement('button');
    cancel.textContent = opts.cancelLabel || 'やめる';
    cancel.addEventListener('click', () => finish(false));
    actions.appendChild(cancel);
  }
  const ok = document.createElement('button');
  ok.className = opts.danger ? 'danger' : 'primary';
  ok.textContent = opts.okLabel || (notice ? '閉じる' : 'OK');
  ok.addEventListener('click', () => finish(true));
  actions.appendChild(ok);
  modal.appendChild(actions);
  overlay.appendChild(modal);
  // 外側を押したときと Esc は「やめる」(お知らせなら「閉じる」)
  overlay._cancel = () => finish(notice);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay._cancel(); });
  modalRoot.appendChild(overlay);
  ok.focus();
}
// 小さな画面の右上に、いつも見える ✕ を付ける(2026-10-03 本人「スマホだと閉じるまでかなりスクロールが必要」)。
// ✕ は、その画面の下の「閉じる」「キャンセル」「やめる」を押したのと同じ。画面の中身を描き直しても付け直す
const CLOSE_LABELS = ['閉じる', 'キャンセル', 'やめる'];
function ensureModalX(modal) {
  if (modal.classList.contains('ask') || modal.querySelector(':scope > .modal-x')) return;
  const btns = Array.from(modal.querySelectorAll('.modal-actions button')).filter(b => CLOSE_LABELS.includes(b.textContent.trim()));
  if (!btns.length) return;
  const x = document.createElement('button');
  x.className = 'modal-x'; x.title = '閉じる'; x.setAttribute('aria-label', '閉じる');
  x.innerHTML = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  x.addEventListener('click', () => { const b = Array.from(modal.querySelectorAll('.modal-actions button')).filter(b => CLOSE_LABELS.includes(b.textContent.trim())).pop(); if (b) b.click(); });
  modal.insertBefore(x, modal.firstChild);
}
new MutationObserver(() => document.querySelectorAll('.modal').forEach(ensureModalX)).observe(document.body, { childList: true, subtree: true });

    <li><b>素材の増加 ＋◯個</b>: その手順で増える素材の見込みです（Lv1換算。Lv2＝3個分）。</li>
    <li><b>（1手当たり ＋◯個）</b>: 素材の増加を、減る手数の見込み（使う手数 − 手数の増加の平均）で割った数です。手数が減らない見込みの手順は「手数消費なし」と出ます。</li>
    <li><b>差し引き ＋◯手</b>: 増える手数から使う手数を引いた数です。プラスなら手数が増えます。</li>
    <li>素材のタブでは素材の増加を、連鎖のタブでは差し引きを、大きな文字で出します。同じ手順なら、どちらのタブでも数字は同じです。</li>
  </ul>
  <p>数字の行</p>
  <ul>
    <li><b>手数の増加 ◯手（◯〜◯手）</b>: 連鎖で増える手数の、補充をいろいろ試した平均です。括弧の中は、補充された駒がどれともマッチしなかったときから、試したうちで一番多く増えたときまでの幅です。</li>
    <li><b>事故の確率 ◯%</b>: 補充次第で、布陣の素材が減る・ピンの駒がマッチする・動くなどが起きる確率です。5%以上は下の<svg class="ico-warn" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l10 18.4H2z" fill="#f2b33d" stroke="#8a5a00" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 9.5v5.5" stroke="#3a2a00" stroke-width="2.4" stroke-linecap="round"/><path d="M12 18.2v.01" stroke="#3a2a00" stroke-width="2.6" stroke-linecap="round"/></svg>の行に出ます。</li>
    <li><b>連鎖のタブにもあります（◯番目）</b>: 同じ手順が、もう一方のタブの「◯番目」のカードにもあります。</li>
  </ul>
  <p><svg class="ico-warn" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l10 18.4H2z" fill="#f2b33d" stroke="#8a5a00" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 9.5v5.5" stroke="#3a2a00" stroke-width="2.4" stroke-linecap="round"/><path d="M12 18.2v.01" stroke="#3a2a00" stroke-width="2.6" stroke-linecap="round"/></svg>の行（注意が必要なこと）</p>
  <ul>
    <li><b>事故の確率 ◯%（…）</b>: 5%以上のときです。ピンが元なら、「ピン⑥の駒（A3）がマッチする」のように、どのピンかを書きます。</li>
    <li><b>「◯」の素材が◯個分減ります</b>: 連鎖のタブで、補充が来なかったときに減る素材の量です。</li>
    <li><b>「◯」のA3が減ります／使わないA4ができます</b>: 2番目以降に登録したMAX布陣への影響です。</li>
    <li><b>そろえたマスを動かします</b>: 目標MAX布陣の形どおりに置いた駒を動かします。</li>
    <li><b>減点 −◯個</b>: 効率の悪い手順に付けたペナルティです。見出しの数字には減点は含まれていませんが、並び順を決める際に減点しています。</li>
  </ul>
  <p>盤面と素材の数</p>
  <ul>
    <li><b>①②③の盤面</b>: 打つ手の順です。赤い枠の2マスを入れ替え、✕のマスを削除します。ピンの駒には、ピンの印が付きます。</li>
    <li><b>手順の後（補充は ?）</b>: 打ち終わった後の盤面です。金色の枠は、新しく目標MAX布陣の形どおりにそろうマスです。赤い点線の枠は、目標MAX布陣の形どおりにそろえてあったのに、この手順でそろわなくなるマスです（<svg class="ico-warn" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l10 18.4H2z" fill="#f2b33d" stroke="#8a5a00" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 9.5v5.5" stroke="#3a2a00" stroke-width="2.4" stroke-linecap="round"/><path d="M12 18.2v.01" stroke="#3a2a00" stroke-width="2.6" stroke-linecap="round"/></svg>「そろえたマスを動かします」が出るカードに付きます）。</li>
    <li><b>10MAXの素材: A1 6個→3個（3.8個）</b>: 矢印の左が今の数、矢印の右が手順を打った後の数です。矢印の右の数は、補充で入ってくる駒を数えていません（何が来るか分からないため）。括弧の中は、補充で入ってくる駒も入れた平均の見込みです。</li>
  </ul>
  <p>今打っている手順の続き</p>
  <ul>
    <li><b>「今打っている手順の続き（②③④）」</b>: 「この手順を打つ」で1手以上打つと、一番上に出るカードです。このカードの数字は、残りの手（②③④）を今の盤面から打ったときの見込みです。打ち終えた①は数えません。</li>
    <li>補充された駒によっては、この数字が変わります。「次の手を探す」を押すと、新しい手順と比べられます。乗り換えるかどうかの目安は、下の「計算のしくみ」の「手順の途中で他の手順に乗り換えない方がよい理由」にあります。</li>
  </ul>
  <p class="sec-h">■ ピン</p>
  <ul>
    <li>「<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 4 4H6l4-4z"/><path d="M12 13v8"/></svg>ピン」を選んで駒を押すとピンが付き、その駒を動かさない手順だけを探します。</li>
    <li>ピンの駒を運びたいマスまでドラッグすると「行き先付きのピン」になり、そこへ近づく（か動かない）手順だけを探します。</li>
    <li>押すと1段階戻ります（行き先付き → ピン → なし）。行き先のマスは、押すと外れ、ドラッグで移せます。</li>
  </ul>
  <p class="sec-h">■ 絞り込み</p>
  <ul>
    <li>素材とレベル・個数を選ぶと、手順の後にその駒が指定した個数以上あるカードだけを出します。</li>
    <li>見るのはカードの素材の数です。矢印の右の数か、括弧の中の数を切り上げた数のどちらかが、指定した個数以上なら出ます。「A3が3個以上」なら、次のようになります。
      <ul>
        <li>A3 1個→<b>3個</b>（3.0個） … 出る（矢印の右が3）</li>
        <li>A3 1個→2個（<b>2.4個</b>） … 出る（括弧の中の2.4を切り上げると3）</li>
        <li>A3 1個→2個（2.0個） … 出ない</li>
      </ul>
    </li>
    <li>括弧の中は平均の見込みなので、出たカードでも3個に届くとは限りません。「届く見込みがある」という目安です。</li>
  </ul>
  <p class="note">※必ず事故になる手順、MAXの駒を削除する手順などは出しません（詳しくは下の「計算のしくみ」）。</p>
  <details class="more"><summary>計算のしくみ（詳しい仕様）</summary>
    <p class="sec-h">■ 計算の流れ</p>
    <p><b>方法論</b>: 手順の候補は総当たり（全探索）で作り、補充の運はモンテカルロ法で平均を出しています。モンテカルロ法は、乱数を使ったシミュレーションを何回も繰り返して、その平均で期待値を求める方法です。</p>
    <ul>
      <li><b>Step1 全部の手順を打つ</b>: 入替と削除を3手まで（「4手まで」なら4手まで）組み合わせて打ちます（3手で約90万通り）。この段階では、補充される駒はどれともマッチしない駒として扱います。この計算は1回だけで、2つのタブで共有します。</li>
      <li><b>Step2 見積もる</b>: 手順ごとに、タブごとの見積もりを出します。
        <ul>
          <li>素材: 素材の増加に、補充される1マスにつき1/4個を足して見積もります。</li>
          <li>連鎖: 補充がどれともマッチしないとしたときの差し引きで見積もります。</li>
        </ul>
      </li>
      <li><b>Step3 候補を選ぶ</b>: タブごとに、見積もりの上位150件を選びます。素材のタブは、表示と同じ並べ方（手数消費なしを先、その後は1手当たり）で選びます。</li>
      <li><b>Step4 シミュレーションする</b>: 選んだ手順を、補充をランダムにして各32回ずつ打ち、平均を出します。
        <ul>
          <li>素材のタブの上位20件と連鎖のタブの上位20件は、精度を高めるため各256回にします。</li>
          <li>同じ手順は、試した結果を2つのタブで共通に使うので、どちらのタブでも同じ数字になります。</li>
          <li>シミュレーションにしているのは、正確に計算すると場合分けが多すぎるためです（補充されるマスが11マスなら、素材の組み合わせだけで4の11乗＝約420万通り）。</li>
        </ul>
      </li>
      <li><b>Step5 結果を表示する</b>: 表示しない手順を除き、似た手順をまとめて、タブごとの並び順で表示します。連鎖のタブは、差し引きが0手以上の手順を出します。表示するカードごとに、補充をランダムにして200回打ち、事故の確率を数えます。</li>
    </ul>
    <p class="sec-h">■ 期待値の計算方法</p>
    <p>素材</p>
    <ul>
      <li>目標MAX布陣に足りない素材を、Lv1換算で数えます（Lv2＝3個分、Lv3＝9個分）。</li>
      <li>つまり、Lv1素材の3個マッチは増減なし、4個マッチは＋2個、5個マッチは＋4個です（4個マッチでは上のレベルの駒が2個できるため）。できた駒のレベルがもう足りているときは増えません。</li>
      <li>布陣に使えない駒は、素材として数えません。布陣に使えない駒とは、形どおりにそろえた駒（盤面で金色に光る駒）に囲まれて、まだそろっていない布陣のマスへ入替で動かせない駒です。例えば、起爆位置に入った駒や、布陣の外の隅にある駒です。斜め入替ありの設定では、斜めに隣り合うマスからも動かせるものとして判定します。</li>
      <li>次の手順には減点（ペナルティ）を付けています。
        <ul>
          <li>目標MAX布陣の素材の3個マッチ1回につき、1個分（Lv2の3個マッチなら3個分）。4個マッチにできた駒を、3個マッチで無駄に使うことを避けるためです。ただし、5個マッチでできた3個の駒が続けてマッチしたときは、減点を付けません。このマッチは5個マッチの一部で、避けられないためです。</li>
          <li>目標MAX布陣の形どおりに置いた駒を動かすと、その駒の分（その列の上が全てMAX布陣どおりのマスだけ）。正しく置いた駒を動かすことを避けるためです。</li>
        </ul>
      </li>
    </ul>
    <p>手数の増加</p>
    <ul>
      <li>マッチは、駒が消えて補充が入るたびに1回目、2回目…と数えます。2回目以降のマッチ1つにつき1手増えます（1回目では増えません）。設定で「ラウンドごとに増える」を選んだときは、その数え方です。PvPモードでは、打った手と残り手数の合計が170手までです。</li>
    </ul>
    <p>事故の確率</p>
    <ul>
      <li>手順を補充をランダムにして200回打ち、補充がどれともマッチしなかった場合と比べて、事故が起きた回の割合です。事故とは次のどれかです。
        <ul>
          <li>目標MAX布陣に必要な素材が減る。</li>
          <li>使わないレベルの駒ができる。</li>
          <li>ピンの駒がマッチする・動く（行き先付きのピンは、マッチするか行き先から離れる）。</li>
        </ul>
      </li>
      <li>次に目指すMAX布陣は、Lv3以上の素材が減るときと、使わないレベルの駒ができるときだけ数えます。</li>
      <li>5%未満の事故の確率は、数字の行に小さく出します。</li>
      <li>0%は、200回試して1回も起きなかったという意味で、全く起きないとは限りません。起爆の手順と、目標MAX布陣もピンもないときは出しません。</li>
    </ul>
    <p>どの数字も補充を試した平均なので、ぶれがあります。</p>
    <p class="sec-h">■ 並び順</p>
    <ul>
      <li>並び順は、減点を引いた数字で決めます。見出しの数字（減点の前）とは違う順になることがあります。</li>
      <li>1手当たりは、減る手数の見込みが0と1の間の数になったときは、1で割ります。減る手数の見込みは平均なので、整数にならないことがあります。</li>
      <li>素材のタブで、並べる数字が小数点第1位まで同じときは、手数の増加の多い順にします。それも同じときは、目標でない素材の高いレベルの駒を消す手順を先にします。</li>
      <li>連鎖のタブは、差し引きの多い順です。</li>
    </ul>
    <p class="sec-h">■ 表示する手順</p>
    <p>次の手順は出しません。</p>
    <ul>
      <li>今目指しているMAX布陣で必ず事故になる手順（連鎖のタブでは、使わないレベルの駒ができる手順と、補充を入れた平均でも素材が減る手順。素材が減っても補充を入れた平均で減らない連鎖は、<svg class="ico-warn" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l10 18.4H2z" fill="#f2b33d" stroke="#8a5a00" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 9.5v5.5" stroke="#3a2a00" stroke-width="2.4" stroke-linecap="round"/><path d="M12 18.2v.01" stroke="#3a2a00" stroke-width="2.6" stroke-linecap="round"/></svg>を付けて出します）</li>
      <li>MAXの駒を削除する手順</li>
      <li>途中で手数が尽きる手順</li>
      <li>素材のタブ: 素材が増えない手順、連鎖の後に手を足しただけの手順、最後の手でマッチが起きない手順（1手だけの削除は出します）、手順の一部の手だけを打つ方が得な手順</li>
      <li>連鎖のタブ: 連鎖の後に手を足しただけの手順</li>
    </ul>
    <p>似た手順のまとめ方</p>
    <ul>
      <li>最後の手と手数が同じ手順は、一番良い1件だけを出します。連鎖のタブでは、「布陣の素材が減らない手順」と「布陣の素材が減るかわりに、手数がもっと増える手順」があれば両方出します。</li>
      <li>打ち終わった後の盤面が同じ手順は、1件だけ出します。</li>
      <li>次に目指すMAX布陣は、手順の候補に影響しません。Lv3以上（補充がLv2ならLv4以上）の素材が減るときと、使わないレベルの駒ができるときに<svg class="ico-warn" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l10 18.4H2z" fill="#f2b33d" stroke="#8a5a00" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 9.5v5.5" stroke="#3a2a00" stroke-width="2.4" stroke-linecap="round"/><path d="M12 18.2v.01" stroke="#3a2a00" stroke-width="2.6" stroke-linecap="round"/></svg>を付けます（今目指している布陣と同じ素材の布陣には付けません）。</li>
    </ul>
    <p class="sec-h">■ 絞り込み</p>
    <ul>
      <li>選べるのは、登録した目標MAX布陣で使う素材とレベルです（2番目以降の布陣も含みます）。</li>
      <li>切り上げは、画面に出ている小数点第1位の数字で行います（画面の数字と判定がずれないように）。</li>
      <li>出ている一覧の中だけを絞ります。一覧に出していない手順（上の「表示する手順」）は対象になりません。</li>
      <li>探し直しはしないので、すぐに絞られます。カードの番号は、絞り込む前の一覧の番号のまま変わりません。</li>
    </ul>
    <p class="sec-h">■ 自動で探すとき</p>
    <ul>
      <li>盤面・残り手数・目標MAX布陣・設定・ピン・探す手数のどれかが変わるたびに探します。</li>
      <li>「この手順を打つ」で打っている途中は、自動では探しません。「次の手を探す」を押せば探せます。</li>
      <li>「盤面を直す」のときは、直し終わってから探します。</li>
      <li>「中断」を押したときは、盤面などが変わるまで探しません。</li>
    </ul>
    <p class="sec-h">■ 手順の途中で他の手順に乗り換えない方がよい理由</p>
    <ul>
      <li>手順の多くは、前半の手で駒を並べて、最後の手で素材を増やします。</li>
      <li>途中で乗り換えると、駒を並べるために打った手が無駄になります。</li>
      <li>手順の途中で「次の手を探す」を押すと、続きの手に1手を足した手順が、続きより大きな数字で一番上に出ることがよくあります。手を足した分、合計が大きくなるためです。</li>
      <li>この手順に乗り換えると、素材が増える最後の手が1手先に延びます。探すたびに乗り換えると、最後の手が先へ先へと延び続けて、素材が増えにくくなります。</li>
      <li>乗り換えを検討するのは、新しい手順の素材の増加が、続きのカードを大きく上回るときがお勧めです。</li>
      <li>目安は、続きの2倍以上で、差が2個以上あるときです。例えば、続きが＋2個で、新しい手順が＋5個のときです。</li>
    </ul>
    <p class="sec-h">■ ピン</p>
    <ul>
      <li>ピンの駒は、入れ替える・削除する・マッチする・上の駒が消えて動く、のどれも起きない手順だけを探します。</li>
      <li>行き先付きのピンの駒は、マッチせず、1手ごとに行き先までのマス数（縦のずれ＋横のずれ）が増えない手順だけを探します。入替で動くときも、同じ列で上の駒が消えて上に詰まるときも同じです（駒は上に詰まり、補充は下から入ります）。そのため、行き先が駒より下にあるときは、その列で駒より上が消える手順は出ません。行き先に着いたら、行き先と番号は自動で外れ、普通のピンになります（そこから動かない手順だけになります）。</li>
      <li>どちらのピンも、目標MAX布陣の起爆の手順は出します。</li>
      <li>1つのマスを行き先にできるのは、1つのピンだけです。ピンの駒のマスを行き先にすることはできます（2つの駒を入れ替えたいときなど）。そのマスを押したりドラッグしたりすると、駒の方の操作になります。</li>
      <li>番号は行き先を付けたときに決まり、他のピンを外しても変わりません。</li>
      <li>補充された駒次第で、ピンの駒がマッチしたり動いたりすることがあります。この起きやすさは事故の確率に含めます。</li>
      <li>自分で打つ手でピンの駒がマッチする・動くとき（行き先付きは、マッチするか行き先から離れるとき）は、打つ前に確認して、ピンを外してから打ちます。行き先付きのピンは、近づく・動かないあいだは、駒について移ります。</li>
      <li>カードの盤面では、手順の途中で動くピンの駒も、1手ごとの位置に印を付けます（補充は「?」として追います）。起爆などでピンの駒がマッチした後の盤面には付けません。</li>
    </ul>
    <p class="sec-h">■ 駒の相対的な位置を見られない理由</p>
    <ul>
      <li>1手の候補は、入替と削除でおよそ100通りあります。3手先まで読むだけで約90万通り、補充される駒の出方まで含めると、更にその何十万倍にもなります。</li>

/* ============================== 設定 ============================== */
/* ============================== ヒーローの絵(使う人が登録する。2026-10-03) ==============================
 * 使う人が、ゲームのスキン画面の「ステージ画像プレビュー」のスクショ(LV1〜最後のレベル)から、駒の絵を切り出して登録する。
 * ツールにはゲームの画像を一切入れない。絵はこの端末のブラウザの中(IndexedDB)だけに保存し、控えをファイルに書き出せる。
 * A〜Dにヒーローを選ぶと(state.speciesChars)、盤面のその素材の駒を、市松模様の背景の上に絵で出す。絵がないレベルは今までどおり文字と色。
 * 切り出す位置(枠)は、スクショの大きさ(縦横のピクセル数)ごとに覚える(state.cropFrames)。端末が変わると画面の大きさが変わるため。 */
const CHAR_DB_NAME = STORAGE_KEY + '_chars';
const CHAR_OUT = 160;   // 切り出した絵の大きさ(ピクセル)
// 絵を探す範囲(横幅・高さに対する割合)。見本のスクショ(1170×2532)では、絵は横0.39〜0.61・縦0.27〜0.37にある。
// 上の「スキン」の帯は左右の縁に触れるので除ける。下の「外観」のボタン(縦0.41〜)は細長いので除ける(機種によって絵の位置がずれても入るように、広めにしてある)
const CHAR_REGION_DEFAULT = { x: 0.12, y: 0.17, w: 0.76, h: 0.29 };
const CHECKER = ['#e7e1ef', '#cdc4db'];   // 絵を出すマスの市松模様の2色
const charStore = new Map();   // 名前 → { name, levels: [data URL(LV1から)], urls: [blob URL] }
function charDb() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined') { reject(new Error('no indexedDB')); return; }
    const r = indexedDB.open(CHAR_DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('chars', { keyPath: 'name' });
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
function charDbRun(mode, fn) {
  return charDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('chars', mode), st = tx.objectStore('chars');
    const req = fn(st);
    tx.oncomplete = () => { db.close(); resolve(req && req.result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  }));
}
function dataUrlToBlobUrl(u) {
  const m = /^data:([^;]+);base64,(.*)$/.exec(u);
  if (!m) return u;
  const b = atob(m[2]), a = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
  return URL.createObjectURL(new Blob([a], { type: m[1] }));
}
function charMemSet(rec) {
  const old = charStore.get(rec.name);
  if (old) old.urls.forEach(u => URL.revokeObjectURL(u));
  charStore.set(rec.name, { name: rec.name, levels: rec.levels.slice(), urls: rec.levels.map(dataUrlToBlobUrl) });
}
function charMemDelete(name) {
  const old = charStore.get(name);
  if (old) old.urls.forEach(u => URL.revokeObjectURL(u));
  charStore.delete(name);
}
function charSave(rec) {
  charMemSet(rec);
  // ブラウザに、このサイトの保存を消さないよう頼む(認められるかはブラウザしだい)
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* 頼めない環境 */ }
  return charDbRun('readwrite', st => st.put({ name: rec.name, levels: rec.levels })).catch(() => {});
}
function charRemove(name) {
  charMemDelete(name);
  for (const sp of SPECIES) if (state.speciesChars[sp] === name) state.speciesChars[sp] = null;
  saveState();
  refreshCharUi();
  return charDbRun('readwrite', st => st.delete(name)).catch(() => {});
}
function charRename(from, to) {
  const rec = charStore.get(from);
  if (!rec) return Promise.resolve();
  charMemDelete(from); charMemSet({ name: to, levels: rec.levels });
  for (const sp of SPECIES) if (state.speciesChars[sp] === from) state.speciesChars[sp] = to;
  saveState();
  refreshCharUi();
  return charDbRun('readwrite', st => { st.delete(from); return st.put({ name: to, levels: rec.levels }); }).catch(() => {});
}
// 絵や名前を出す所を全て描き直す(盤面・素材のボタン・盤面の下のボタンと文(読み取りのボタン)・目標MAX布陣の行と札・絞り込み)。
// ヒーローの絵の読み込み・登録・削除・名前の変更・控えの読み込みのあとに呼ぶ
function refreshCharUi() {
  renderGameControls(); renderBrushRow(); renderBoard(); updateShortageLine(); renderPatternList(); renderFilterRow();
}
function loadChars() {
  return charDbRun('readonly', st => st.getAll()).then(list => {
    (list || []).forEach(r => { if (r && typeof r.name === 'string' && Array.isArray(r.levels)) charMemSet(r); });
    refreshCharUi();

}
// 素材とレベルの駒の絵(blob URL)。ヒーローを選んでいない・そのレベルの絵がないときは null
function charImage(species, level) {
  const name = state.speciesChars && state.speciesChars[species];
  const rec = name ? charStore.get(name) : null;
  return rec && rec.urls[level - 1] || null;
}
// 盤面のマスに絵を出す
// 盤面の市松模様の板の上に、絵だけを置く(マスの背景は塗らない。足元の影は付けない: 2026-10-03 本人「やりすぎ」、小さい盤面で汚れに見えるため)
function paintCharCell(div, species, level, x, y) {
  const img = charImage(species, level);
  if (!img) return false;
  div.classList.add('char');
  div.style.background = `url("${img}") center / 100% auto no-repeat`;
  div.textContent = '';
  div.title = `${species}${level}`;

}
// スクショの範囲(region。横幅・高さに対する割合 {x, y, w, h})から、ヒーローの絵を探す(2026-10-03 本人「枠は絵のある位置を教えるだけで、大きさや中央への配置はツールが」)。
// 背景(範囲の中で一番多い色。スキン画面の紫)に近い色をたどって抜き、残ったかたまりのうち、範囲の縁に触れず、細長くない、一番大きいものを絵とする
// (「LV」の文字・左右の矢印・上の帯・下のボタンを除くため)。そのかたまりの範囲に重なる小さなかたまり(飾りなど)も絵に含める。
// 返り値: { canvas: 範囲を縮めた絵(背景と他のかたまりは透明), box: 絵のある所 {x, y, w, h}(canvas の中のピクセル) }。見つからなければ null
const CHAR_WORK = 480;   // 絵を探すときに、範囲をこの横幅に縮めて調べる
function findCharInShot(img, region) {
  const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
  const rx = region.x * W, ry = region.y * H, rw = region.w * W, rh = region.h * H;
  if (rw < 4 || rh < 4) return null;
  const k = Math.min(1, CHAR_WORK / rw), cw = Math.max(1, Math.round(rw * k)), ch = Math.max(1, Math.round(rh * k));
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const g = cv.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, rx, ry, rw, rh, 0, 0, cw, ch);
  const d = g.getImageData(0, 0, cw, ch), p = d.data, N = cw * ch;
  // 背景の色: 範囲の中で一番多い色(スキン画面の紫)。範囲の縁は、機種によって画面の外側の暗い所になるので使わない
  const hist = new Uint32Array(4096), sum = new Float64Array(4096 * 3);
  for (let q = 0; q < N; q++) { const b = ((p[q * 4] >> 4) << 8) | ((p[q * 4 + 1] >> 4) << 4) | (p[q * 4 + 2] >> 4); hist[b]++; sum[b * 3] += p[q * 4]; sum[b * 3 + 1] += p[q * 4 + 1]; sum[b * 3 + 2] += p[q * 4 + 2]; }
  let top = 0; for (let b = 1; b < 4096; b++) if (hist[b] > hist[top]) top = b;
  const bg = [sum[top * 3] / hist[top], sum[top * 3 + 1] / hist[top], sum[top * 3 + 2] / hist[top]];
  const dist = q => Math.hypot(p[q * 4] - bg[0], p[q * 4 + 1] - bg[1], p[q * 4 + 2] - bg[2]);
  // 背景: 背景に近い色のマスがつながったかたまりのうち、範囲の縁に触れるか、とても大きい(範囲の4分の1以上)ものだけ。
  // 絵の輪郭の内側に囲まれた、背景に似た色の部分(体の色など)は、背景にしない(2026-10-03 本人: LV1 のコウモリの体が抜けて白く見えた)
  const T = 38, near = new Uint8Array(N), isBg = new Uint8Array(N), stack = [], seenN = new Uint8Array(N);
  for (let q = 0; q < N; q++) if (dist(q) < T) near[q] = 1;
  for (let s0 = 0; s0 < N; s0++) {
    if (!near[s0] || seenN[s0]) continue;
    const comp = [s0]; seenN[s0] = 1; stack.push(s0);
    let edge = false;
    while (stack.length) {
      const q = stack.pop(), x = q % cw;
      if (x === 0 || x === cw - 1 || q < cw || q >= N - cw) edge = true;
      for (const n of [x > 0 ? q - 1 : -1, x < cw - 1 ? q + 1 : -1, q >= cw ? q - cw : -1, q < N - cw ? q + cw : -1]) if (n >= 0 && near[n] && !seenN[n]) { seenN[n] = 1; stack.push(n); comp.push(n); }

    label[s] = c.id; stack.push(s);
    while (stack.length) {

      c.area++; if (x < c.x0) c.x0 = x; if (x > c.x1) c.x1 = x; if (y < c.y0) c.y0 = y; if (y > c.y1) c.y1 = y;
      if (x === 0 || y === 0 || x === cw - 1 || y === ch - 1) c.edge = true;
      for (const n of [x > 0 ? q - 1 : -1, x < cw - 1 ? q + 1 : -1, y > 0 ? q - cw : -1, y < ch - 1 ? q + cw : -1]) if (n >= 0 && !isBg[n] && label[n] < 0) { label[n] = c.id; stack.push(n); }

  g.putImageData(d, 0, 0);
  return { canvas: cv, box: { x: box.x0, y: box.y0, w: box.x1 - box.x0 + 1, h: box.y1 - box.y0 + 1 }, scale: k, region };
}
// 見つけた絵を、CHAR_OUT 四方の真ん中に置く。縮尺は全レベルで同じ(一番大きい絵が9割に収まるように。レベルごとの大きさの違いはゲームのまま)
function layoutCharImages(found) {
  const big = Math.max(...found.map(f => Math.max(f.box.w, f.box.h) / f.scale));
  return found.map(f => {
    const s = CHAR_OUT * 0.9 / big / f.scale, w = f.box.w * s, h = f.box.h * s;
    const cv = document.createElement('canvas'); cv.width = cv.height = CHAR_OUT;
    const g = cv.getContext('2d'); g.imageSmoothingQuality = 'high';
    g.drawImage(f.canvas, f.box.x, f.box.y, f.box.w, f.box.h, (CHAR_OUT - w) / 2, (CHAR_OUT - h) / 2, w, h);
    return cv.toDataURL('image/png');

}
function loadImageFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => resolve({ img: im, url, time: file.lastModified || 0 });
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    im.src = url;
  });
}
/* ---------- スクショから盤面を読み取る(2026-10-03 本人「ヒーローを登録したら盤面の読み取り機能を使えるようにしたい」) ----------
 * A〜Dの4体全てにヒーローを選んでいるときだけ使える。登録したヒーローの絵(全レベル)と、スクショの盤面のマスを1マスずつ見比べる。
 * 本人の盤面のスクショ8枚を、画面の大きさを変えた6通りで試して、全てのマスを正しく読めた(試しは tools/board_read/)。 */
// 1. 盤面の位置: マスの地の色(2色の市松模様)から、6×6のマスの位置と大きさを探す
// 2. 駒: マスごとに、登録したヒーローの絵(全レベル)と見比べて、一番近いものを選ぶ
const RD_C = 48;   // 見比べるときのマスの大きさ(ピクセル)

function rdPixels(img, sx, sy, sw, sh, dw, dh) {
  const cv = document.createElement('canvas'); cv.width = dw; cv.height = dh;
  const g = cv.getContext('2d', { willReadFrequently: true }); g.imageSmoothingQuality = 'high';
  g.drawImage(img, sx, sy, sw, sh, 0, 0, dw, dh);
  return g.getImageData(0, 0, dw, dh).data;
}

// 盤面の位置。返り値 { x0, y0, s, good }(元の画像のピクセル。s はマスの大きさ)。見つからなければ null
function rdFindBoard(im) {
  const W0 = im.naturalWidth || im.width, H0 = im.naturalHeight || im.height;
  const dist = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]);
  const scan = (SW, sList, dxList, y0List) => {
    const k = SW / W0, SH = Math.round(H0 * k), d = rdPixels(im, 0, 0, W0, H0, SW, SH);
    const col = (x, y) => { x = Math.round(x); y = Math.round(y); const q = (y * SW + x) * 4; return [d[q], d[q + 1], d[q + 2]]; };
    const all = [];
    for (const sO of sList(W0)) {
      const s = sO * k;
      for (const dxO of dxList) {
        const x0 = (SW - 6 * s) / 2 + dxO * k;
        if (x0 < 0 || x0 + 6 * s > SW - 1) continue;
        for (const y0O of y0List(sO)) {
          const y0 = y0O * k;
          if (y0 < 0 || y0 + 6 * s > SH - 1) continue;
          const ins = s * 0.07, cells = [];
          for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) {
            const cx = x0 + c * s, cy = y0 + r * s;
            cells.push([col(cx + ins, cy + ins), col(cx + s - ins, cy + ins), col(cx + ins, cy + s - ins), col(cx + s - ins, cy + s - ins)]);
          }
          const sum = [[0, 0, 0, 0], [0, 0, 0, 0]];
          cells.forEach((cs, i) => {
            if (Math.max(dist(cs[0], cs[1]), dist(cs[0], cs[2]), dist(cs[0], cs[3])) >= 30) return;
            const p = ((i / 6 | 0) + i % 6) % 2; for (let t = 0; t < 3; t++) sum[p][t] += cs[0][t]; sum[p][3]++;
          });
          if (sum[0][3] < 10 || sum[1][3] < 10) continue;
          const m = sum.map(a => [a[0] / a[3], a[1] / a[3], a[2] / a[3]]);
          if (dist(m[0], m[1]) < 12) continue;
          let good = 0;
          cells.forEach((cs, i) => { const p = ((i / 6 | 0) + i % 6) % 2; good += cs.filter(c => dist(c, m[p]) < 18 && dist(c, m[1 - p]) > dist(c, m[p])).length; });
          all.push({ good, s: sO, x0: (SW - 6 * s) / 2 / k + dxO, y0: y0O, dx: dxO, bg: m });
        }
      }
    }
    return all.sort((a, b) => b.good - a.good);
  };
  const range = (a, b, st) => { const r = []; for (let v = a; v <= b + 1e-9; v += st) r.push(v); return r; };
  // 粗く探す(横幅240ピクセルに縮めて)。上位10件の候補を、細かく(横幅360ピクセルで)探し直す。
  // 180ピクセルでは、左右に余白のある画面(タブレットなど)で盤面が小さくなり、1マスずれた位置を選んだ
  const SW1 = 240, u1 = W0 / SW1, SW2 = 360, u2 = W0 / SW2;
  const c1 = scan(SW1, W => range(W * 0.08, W * 0.1667, u1 * 0.5), range(-0.02 * W0, 0.02 * W0, u1 * 2), s => range(0, H0 - 6 * s, u1));
  const picks = [];
  for (const c of c1) { if (picks.length >= 10) break; if (picks.every(p => Math.abs(p.y0 - c.y0) > u1 * 3 || Math.abs(p.s - c.s) > u1)) picks.push(c); }
  let b = null;
  for (const c of picks) {
    const c2 = scan(SW2, () => range(c.s - u1, c.s + u1, u2 * 0.25), range(c.dx - u1 * 2.5, c.dx + u1 * 2.5, u2), () => range(c.y0 - u1 * 1.5, c.y0 + u1 * 1.5, u2))[0];
    if (c2 && (!b || c2.good > b.good)) b = c2;
  }
  return b && b.good >= 100 ? b : null;   // 144か所のうち100か所以上が市松模様に合うこと
}

// 絵(160四方、透明あり)を、マスの L 倍の大きさにしたときの、見比べる点の一覧
function rdTemplate(spr, L, step = 2) {
  const n = Math.max(4, Math.round(L * RD_C));
  const d = rdPixels(spr, 0, 0, spr.naturalWidth || spr.width, spr.naturalHeight || spr.height, n, n);
  const pts = [];
  for (let y = 0; y < n; y += step) for (let x = (y / step) % 2 ? 1 : 0; x < n; x += step) {
    const q = (y * n + x) * 4; if (d[q + 3] > 200) pts.push(x - n / 2, y - n / 2, d[q], d[q + 1], d[q + 2]);
  }
  return pts;
}
function rdScore(cd, pts, ox, oy) {
  let s = 0, n = 0;
  for (let i = 0; i < pts.length; i += 5) {
    const x = Math.round(RD_C / 2 + ox + pts[i]), y = Math.round(RD_C / 2 + oy + pts[i + 1]);
    n++;
    if (x < 0 || y < 0 || x >= RD_C || y >= RD_C) { s += 200; continue; }
    const q = (y * RD_C + x) * 4;
    s += Math.abs(cd[q] - pts[i + 2]) + Math.abs(cd[q + 1] - pts[i + 3]) + Math.abs(cd[q + 2] - pts[i + 4]);
  }
  return s / n;
}
// ずれを粗く(2ピクセルおき)探してから、その周りを細かく探す。
// 3ピクセルおきでは、線の細い駒(雪の結晶)で合う位置を飛び越えた(2026-10-03、本人の盤面のスクショで)
function rdBest(cd, pts, R = 9, st = 2) {
  let b = { v: 1e9, ox: 0, oy: 0 };
  for (let oy = -R; oy <= R; oy += st) for (let ox = -R; ox <= R; ox += st) { const v = rdScore(cd, pts, ox, oy); if (v < b.v) b = { v, ox, oy }; }
  const c = b, f = st - 1;
  for (let oy = c.oy - f; oy <= c.oy + f; oy++) for (let ox = c.ox - f; ox <= c.ox + f; ox++) { const v = rdScore(cd, pts, ox, oy); if (v < b.v) b = { v, ox, oy }; }
  return b;
}
function rdCells(im, g) {
  const cells = [];
  for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) cells.push(rdPixels(im, g.x0 + c * g.s, g.y0 + r * g.s, g.s, g.s, RD_C, RD_C));
  return cells;
}
// ヒーローごとに、絵の大きさ(マスの何倍か)を決める: 盤面の中で一番よく合うマスの近さが最も小さくなる大きさ
function rdFitScale(cells, sprites) {
  // 絵の大きさ(マスの何倍か)。本人のヒーロー4体では1.03〜1.09倍だった(一番大きいレベルの絵が、マスとほぼ同じ大きさ)
  let best = null;
  for (let L = 0.95; L <= 1.1501; L += 0.05) {
    const tms = sprites.map(sp => rdTemplate(sp, L, 3));
    const v = cells.map(cd => Math.min(...tms.map(p => rdBest(cd, p, 6).v))).sort((a, b) => a - b);
    const top = v[0] + v[1] + v[2];
    if (!best || top < best.top) best = { L, top };
  }
  return best;
}

// 盤面全体を読む。heroes: [{ sprites: [LV1から] }](A〜Dの順)
// 返り値: { grid: 36マスの { h: ヒーローの番号, lv: レベル, v: 近さ(小さいほど似ている), moved: 動いている駒として読んだか } か null(読めない),
//           board: 盤面の位置, ms: 時間 }
const RD_OK = 115;     // 近さの数字がこれ以下なら、その駒と読む(本人の盤面のスクショ3枚で: 正しい駒は105以下、登録していない駒は138以上)
const RD_MOVE_OK = 80; // 駒が抜けたマスを探し直したときに、見えている7割の点の近さがこれ以下なら、その駒と読む
function rdRead(im, heroes) {
  const t0 = performance.now();
  const g = rdFindBoard(im);
  if (!g) return { grid: null, ms: performance.now() - t0 };
  const cells = rdCells(im, g);
  const t1 = performance.now();
  const tms = heroes.map(h => { const L = rdFitScale(cells, h.sprites).L; return { L, t: h.sprites.map(sp => rdTemplate(sp, L)) }; });
  const t2 = performance.now();
  const grid = cells.map(cd => {
    let b = null;
    tms.forEach((h, hi) => h.t.forEach((p, li) => { const r = rdBest(cd, p); if (!b || r.v < b.v) b = { h: hi, lv: li + 1, v: r.v, ox: r.ox, oy: r.oy }; }));
    return b;
  });
  const t3 = performance.now();
  // 読めなかったマス: 動いている途中の駒かもしれないので、周りのマスの方までずらして探し直す。
  // 駒は、マスの中で決まった位置に描かれる(絵ごとに少しずれる)ので、その位置から横か縦にずらす。ずらす幅はマスの0.6倍まで、1ピクセルおき
  const base = tms.map(h => h.t.map(() => []));
  grid.forEach(b => { if (b.v <= RD_OK) base[b.h][b.lv - 1].push([b.ox, b.oy]); });
  const all = [].concat(...base.map(h => [].concat(...h)));
  const med = a => { const s = a.slice().sort((x, y) => x - y); return s.length ? s[s.length >> 1] : 0; };
  const allOff = [med(all.map(o => o[0])), med(all.map(o => o[1]))];
  const offOf = (hi, li) => base[hi][li].length ? [med(base[hi][li].map(o => o[0])), med(base[hi][li].map(o => o[1]))] : allOff;
  const W = RD_C * 2.2 | 0, M = Math.round(RD_C * 0.6), redo = [];
  grid.forEach((b, i) => {
    const r = i / 6 | 0, c = i % 6, empty = rdEmptyRate(cells[i], g.bg[(r + c) % 2]) > 0.9;   // 駒が動いて抜けたマス(本人の盤面のスクショで: 抜けたマス0.99、駒があるマスは0.73以下)
    if (empty || b.v > RD_OK) redo.push({ i, empty });
  });
  // 読めないマスがとても多いときは、選んだヒーローが盤面と合っていない。探し直さずに「?」にする
  for (const { i, empty } of redo) {
    grid[i] = null;
    if (redo.length > 8) continue;
    const r = i / 6 | 0, c = i % 6;
    const d = rdPixels(im, g.x0 + (c - 0.6) * g.s, g.y0 + (r - 0.6) * g.s, g.s * 2.2, g.s * 2.2, W, W);
    let best = null;
    tms.forEach((h, hi) => h.t.forEach((p, li) => {
      const [bx, by] = offOf(hi, li);
      for (let k = -M; k <= M; k++) for (let j = -1; j <= 1; j++) for (const [dx, dy] of [[k, j], [j, k]]) {
        const cx = W / 2 + bx + dx, cy = W / 2 + by + dy;
        const v = rdRobust(d, W, p, cx, cy, 1), t = empty ? rdRobust(d, W, p, cx, cy, 0.7) : 1e9;
        // 駒がずれただけなら、全部の点で近い。駒が抜けたマスに隣の駒が入りかけているときは、他の駒と重なるので、見えている7割の点で比べる
        const ok = v <= RD_OK || t <= RD_MOVE_OK, score = Math.min(v, t);
        if (ok && (!best || score < best.v)) best = { h: hi, lv: li + 1, v: score, moved: true, dx, dy };
      }
    }));
    grid[i] = best;
  }
  return { grid, board: g, ms: [t1 - t0, t2 - t1, t3 - t2, performance.now() - t3].map(Math.round), L: tms.map(h => h.L.toFixed(2)) };
}
// マスの真ん中の部分のうち、マスの地の色(bg)に近い点の割合。駒が動いて抜けたマスは、この割合が大きい
function rdEmptyRate(cd, bg) {
  let n = 0, e = 0;
  for (let y = RD_C * 0.2 | 0; y < RD_C * 0.8; y++) for (let x = RD_C * 0.2 | 0; x < RD_C * 0.8; x++) {
    const q = (y * RD_C + x) * 4; n++;
    if (Math.abs(cd[q] - bg[0]) + Math.abs(cd[q + 1] - bg[1]) + Math.abs(cd[q + 2] - bg[2]) < 40) e++;
  }
  return e / n;
}
// 見えている部分だけで見比べる: 差の小さい割合 keep の点の平均(重なった別の駒の部分を除く)
function rdRobust(d, W, pts, cx, cy, keep = 0.7) {
  const diffs = [];
  for (let i = 0; i < pts.length; i += 5) {
    const x = Math.round(cx + pts[i]), y = Math.round(cy + pts[i + 1]);
    if (x < 0 || y < 0 || x >= W || y >= W) { diffs.push(200); continue; }
    const q = (y * W + x) * 4;
    diffs.push(Math.abs(d[q] - pts[i + 2]) + Math.abs(d[q + 1] - pts[i + 3]) + Math.abs(d[q + 2] - pts[i + 4]));
  }
  diffs.sort((a, b) => a - b);
  const n = Math.max(1, Math.round(diffs.length * keep));
  let s = 0; for (let i = 0; i < n; i++) s += diffs[i];
  return s / n;
}

// ヒーローの絵(blob URL)を画像にする。読み取りのたびに作り直さないように覚えておく
const rdImageCache = new Map();
function rdLoadImage(url) {
  if (rdImageCache.has(url)) return rdImageCache.get(url);
  const p = new Promise((resolve, reject) => { const im = new Image(); im.onload = () => resolve(im); im.onerror = reject; im.src = url; });
  rdImageCache.set(url, p);
  return p;
}
// A〜Dの4体全てにヒーローを選んでいるか(読み取りのボタンを出す条件)
function boardReadReady() {
  return SPECIES.every(sp => state.speciesChars && state.speciesChars[sp] && charStore.has(state.speciesChars[sp]));
}
function boardReadButtonHtml(cls = '') {
  return boardReadReady() ? `<button id="btnReadShot"${cls ? ` class="${cls}"` : ''}>スクショから読み取る</button>` : '';
}
// 「スクショから読み取る」: スクショを選ぶ → 読み取る → 盤面を置き換える
function bindBoardReadButton() {
  const btn = document.getElementById('btnReadShot');
  if (!btn) return;
  btn.addEventListener('click', () => {
    if (!boardReadReady()) { refresh(); return; }
    const fi = document.createElement('input');
    fi.type = 'file'; fi.accept = 'image/*';
    fi.addEventListener('change', async () => {
      const f = fi.files && fi.files[0];
      if (!f) return;
      btn.disabled = true; btn.textContent = '読み取り中…';
      let shot = null;
      try {
        shot = await loadImageFile(f);
        const heroes = await Promise.all(SPECIES.map(sp => Promise.all(charStore.get(state.speciesChars[sp]).urls.map(rdLoadImage)).then(sprites => ({ sprites }))));
        await new Promise(r => setTimeout(r, 30));   // 「読み取り中…」を画面に出してから読む
        const t0 = performance.now();
        const res = rdRead(shot.img, heroes);
        applyBoardRead(res, (performance.now() - t0) / 1000);
      } catch (e) {
        openNotice('スクショを読み込めませんでした。別のスクショを選んでください。');
      } finally {
        if (shot) URL.revokeObjectURL(shot.url);
        refresh();
      }
    });
    fi.click();
  });
}
function applyBoardRead(res, sec) {
  // 試しの版(test.html)だけ、スマホでの時間を測るために、かかった時間を出す
  const time = /test\.html$/.test(location.pathname) ? `（読み取りにかかった時間: ${sec.toFixed(1)}秒）` : '';
  if (!res.grid) { openNotice('スクショの中に盤面が見つかりませんでした。ゲームの盤面が全て写っているスクショを選んでください。' + time); return; }
  // 読めた駒でも、その素材で盤面に出ないレベル(設定の最大レベルより上など)は「?」にする
  const cells = res.grid.map(b => {
    if (!b) return null;
    const sp = SPECIES[b.h];
    return b.lv >= minBoardLevelOf(sp) && b.lv <= (state.maxLevels[sp] || 7) ? { species: sp, level: b.lv } : null;
  });
  const unread = cells.filter(c => !c).length;
  if (unread >= 9) { openNotice('多くのマスを読み取れませんでした。「ヒーロー」の画面で、A〜Dにこの盤面のヒーローを選んでいるか確かめてください。' + time); return; }
  const g = state.game;
  const apply = () => {
    for (let i = 0; i < SIZE * SIZE; i++) state.board[i / SIZE | 0][i % SIZE] = cells[i] || { species: '?', level: 1 };
    if (g.phase === 'move') g.queue = [];
    onBoardChanged();
    openNotice('スクショから盤面を読み取りました。ゲーム画面と見比べて、違うマスがあれば直してください。' +
      (unread ? `読み取れなかった${unread}マスは「?」にしました。ゲーム画面を見て入力してください。` : '') + time);
  };
  if (g.phase === 'move' && g.future.length) withFutureDropped(apply); else apply();
}
function charThumbsHtml(levels, size = 30, selected = -1) {
  return levels.map((u, i) => `<span class="char-thumb${i === selected ? ' sel' : ''}" data-i="${i}" style="width:${size}px;height:${size}px;background:${CHECKER[0]} url('${u}') center / 92% auto no-repeat;" title="LV${i + 1}"></span>`).join('');
}
function newOverlay() {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  const modal = document.createElement('div');
  modal.className = 'modal';
  overlay.appendChild(modal);
  modalRoot.appendChild(overlay);
  return { overlay, modal, close: () => overlay.remove() };
}
// 「ヒーロー」の画面: A〜Dのヒーローを選ぶ、登録・一覧・控え
// 最大レベルを下げたときは、盤面と布陣のレベルもそこまでに抑える(設定の保存と、ヒーローの絵に合わせたとき)
function clampLevelsToMax() {
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
    const c = state.board[y][x];
    if (c && SPECIES.includes(c.species) && c.level > state.maxLevels[c.species]) c.level = state.maxLevels[c.species];
  }
  state.patterns.forEach(p => { p.cells = p.cells.map(row => row.map(v => (v === 'X' ? v : Math.min(v, state.maxLevels[p.species])))); });
}
// ヒーローを選んでいる素材の最大レベルを、登録した絵のレベルの数に合わせる(2026-10-03 本人「自動で揃えてもらった方が絶対にいい」)。
// ステージ画像プレビューは最後のレベルまで見られるので、全レベルを登録すれば、絵の数がゲームの最大レベルと同じになる。
// 変えたときは、画面に出す文を返す(変えなければ空)
function syncMaxLevelToChar(sp) {
  const name = state.speciesChars[sp], rec = name ? charStore.get(name) : null;
  if (!rec) return '';
  const n = Math.min(LEVEL_LIMIT, rec.levels.length), old = state.maxLevels[sp] || 7;
  if (n < 2 || n === old) return '';
  state.maxLevels[sp] = n;
  clampLevelsToMax();
  saveState();

}

// ヒーローを選んでいる素材の色を、ヒーローの絵に合わせて決める(2026-10-03 本人「一度ヒーローを選ぶと色が変えられない」)。
// 絵の色の付いた点を、色の系統(黒と白を除く5つ)のうち色合いが一番近いものに振り分けて数え、多い系統にする。
// ヒーロー同士で同じ系統にならないよう、はっきり決まるヒーローから順に、まだ使っていない系統を取る。
// 決め直すのはヒーローを選んだとき・登録し直したとき・控えを読み込んだときだけ。設定の「素材の色」で変えることもできる

function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;

// 系統ごとの点数を、多い順に [系統, 点数] で返す
async function heroColorVotes(name) {
  const urls = charStore.get(name).urls, key = name + ':' + urls.map(u => u.length).join(',');
  if (heroColorCache.has(key)) return heroColorCache.get(key);
  const famHue = HUE_FAMILIES.map(k => rgbToHsv(...hexToRgb(COLOR_FAMILIES[k].stops[1]))[0]);

  cv.width = S; cv.height = S;

    const img = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = u; });
    if (!img) continue;
    cx.clearRect(0, 0, S, S); cx.drawImage(img, 0, 0, S, S);
    const d = cx.getImageData(0, 0, S, S).data, lv = {};
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 200) continue;
      const [h, sat, v] = rgbToHsv(d[i], d[i + 1], d[i + 2]);
      if (sat < 0.35 || v < 0.3) continue;   // 線・影・白っぽい所は数えない
      let best = 0, bd = 1e9;
      famHue.forEach((fh, k) => { const dh = Math.min(Math.abs(h - fh), 360 - Math.abs(h - fh)); if (dh < bd) { bd = dh; best = k; } });
      lv[HUE_FAMILIES[best]] = (lv[HUE_FAMILIES[best]] || 0) + sat * v;
    }

    const sum = Object.values(lv).reduce((a, b) => a + b, 0);
    if (sum) for (const k in lv) votes[k] = (votes[k] || 0) + lv[k] / sum;
  }
  const ranked = Object.entries(votes).sort((a, b) => b[1] - a[1]);

}
async function autoHeroColors() {
  const list = [];
  for (const sp of SPECIES) { const n = heroNameOf(sp); if (n) list.push({ sp, votes: await heroColorVotes(n) }); }
  if (!list.length) return;
  const sure = v => !v.length ? 0 : v.length < 2 ? Infinity : v[0][1] / v[1][1];
  list.sort((a, b) => sure(b.votes) - sure(a.votes));
  const taken = new Set();
  let changed = false;
  for (const { sp, votes } of list) {
    const fam = votes.map(v => v[0]).find(k => !taken.has(k)) || HUE_FAMILIES.find(k => !taken.has(k)) || state.speciesColors[sp];
    taken.add(fam);
    if (state.speciesColors[sp] !== fam) { state.speciesColors[sp] = fam; changed = true; }
  }
  if (!changed) return;
  applySpeciesColors();

}

/* ============================== 記録の書き出し・読み込み・リセット ============================== */
// 1局の記録を書き出す。設定・目標MAX布陣は meta に入れる。
function exportGameRecord() {
  const g = state.game;
  // 「1手進める」でまだ進めていない手も含めて、1局全部を書き出す
  const all = g.log.concat(g.future || []);
  // 押せないときは理由を出す(マウスを乗せたときの説明はスマホで見えないため)
  if (g.phase === 'fix') { openNotice('補充の入力を確定してから押してください。'); return; }
  if (!all.length) { openNotice('1手以上打つと書き出せます。'); return; }
  const lastBoard = g.future && g.future.length ? all[all.length - 1].after : state.board;
  let left = g.start;
  const log = all.map(e => {
    left = left - 1 + e.chain + (e.adjust || 0);
    return Object.assign({ chainOverride: null, cleared: 0, edited: false }, JSON.parse(JSON.stringify(e)), { leftAfter: left });
  });
  const pad = n => String(n).padStart(2, '0');
  const d = new Date();
  const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  const record = {
    meta: {
      source: 'simulator',
      practice: !!g.practice,
      exportedAt: d.toISOString(),
      start: g.start,
      memo: '',
      settings: {
        maxLevels: state.maxLevels, refillLevels: state.refillLevels, diagonal: state.diagonal,
        increasingRecovery: state.increasingRecovery, refillInputMode: state.refillInputMode, pvp: state.pvp,
      },
      patterns: state.patterns,
      currentPatternId: state.currentPatternId,
    },
    phase: 'move',
    board: cloneGrid(lastBoard),
    initialBoard: cloneGrid(all[0].before),
    log,
    pending: null,
  };
  // .txt にして、上に人が読むための一覧、区切りの行のあとに「記録を読み込む」で使うデータ(JSON)を入れる
  // 上の一覧の合計も、「1手進める」でまだ進めていない手まで含めた1局全部で数える
  const chainAll = all.reduce((s, e) => s + e.chain, 0), adjustAll = all.reduce((s, e) => s + (e.adjust || 0), 0);
  const cellText = c => (c ? `${c.species}${c.level}` : '--');
  const boardText = g => g.map(row => '  ' + row.map(cellText).join(' ')).join('\r\n');
  const target = currentTargetPattern();
  const lines = [
    'EGG Navi 1局の記録',
    `書き出した日時: ${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`,
    ...(g.practice ? ['練習モード: 最初の盤面と補充は、ツールがランダムに決めました。'] : []),
    `始めの残り手数: ${g.start} / 打った手: ${log.length}手 / 連鎖で増加: ${chainAll}手${adjustAll ? ` / 手数の直し: ${adjustAll > 0 ? '+' : ''}${adjustAll}手` : ''} / 最後の残り手数: ${left}`,
    `設定: 最大レベル A${state.maxLevels.A} B${state.maxLevels.B} C${state.maxLevels.C} D${state.maxLevels.D}` +
      ` / 補充レベル A${state.refillLevels.A} B${state.refillLevels.B} C${state.refillLevels.C} D${state.refillLevels.D}` +
      ` / 斜め入替 ${state.diagonal ? 'あり' : 'なし'} / 連鎖による増加がラウンドごとに増える ${state.increasingRecovery ? 'あり' : 'なし'} / PvPモード ${state.pvp ? 'あり' : 'なし'}`,
    `目標MAX布陣: ${state.patterns.length ? state.patterns.map((p, i) => `${i + 1}番目「${p.name}」（${p.species}）${target && target.id === p.id ? '←今目指している' : ''}`).join(' / ') : 'なし'}`,
    '',
    '手ごとの記録:',
    ...log.map((e, i) => `  手${i + 1}  ${describeMove(e.move)}  増加${e.chain}${e.adjust ? `  直し${e.adjust > 0 ? '+' : ''}${e.adjust}` : ''}  残り${e.leftAfter}${e.src === 'card' ? `  （カードの手順 ${e.step}/${e.total}手目）` : ''}`),
    '',
    '最初の盤面:',
    boardText(all[0].before),
    '',
    '最後の盤面:',
    boardText(lastBoard),
    '',
    '===== ここから下は「記録を読み込む」で使うデータです（消さないでください） =====',
    JSON.stringify(record, null, 1),
  ];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/plain;charset=utf-8' }));
  a.download = `記録-${stamp}.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('btnExportGame').addEventListener('click', exportGameRecord);
// 記録を読み込む: 書き出した記録(.txt。昔の .json も)を読み、最初の盤面から「1手進める」で再現できるようにする
// 記録のファイルから、中身を点検したデータを取り出す(読めない・形がおかしいときは null)
function parseRecordText(text) {
  try {
    const t = String(text).replace(/^﻿/, '');
    const m = t.search(/^=====.*データ.*=====\s*$/m);   // 区切りの行(書き方が変わる前の記録も読む)
    const d = JSON.parse(t.slice(m >= 0 ? t.indexOf('{', m) : t.indexOf('{')));
    if (!d || !Array.isArray(d.log) || !d.log.length) return null;
    const log = d.log.map(cleanLogEntry);
    const init = cleanGrid(d.initialBoard || d.log[0].before);
    const meta = d.meta && typeof d.meta === 'object' ? d.meta : {};
    const st = meta.settings && typeof meta.settings === 'object' ? meta.settings : {};
    const maxLevels = {}, refillLevels = {};
    for (const sp of SPECIES) {
      maxLevels[sp] = cleanInt(st.maxLevels && st.maxLevels[sp], 2, LEVEL_LIMIT, 7);
      refillLevels[sp] = cleanInt(st.refillLevels && st.refillLevels[sp], 1, 2, 1);
    }
    const patterns = Array.isArray(meta.patterns) ? meta.patterns.map(cleanPattern) : [];
    return {
      log, init, patterns, maxLevels, refillLevels,
      diagonal: !!st.diagonal, pvp: !!st.pvp, increasingRecovery: !!st.increasingRecovery,
      start: cleanInt(meta.start, 1, 999, 50),
      practice: !!meta.practice,
    };
  } catch (e) { return null; }
}
// skipAsk … true なら確認を出さずに読み込む(確かめの道具から使う)
function importGameRecord(text, skipAsk) {
  const rec = parseRecordText(text);
  if (!rec) { openNotice('記録を読み込めませんでした。「記録を書き出す」で書き出したファイルを選んでください。'); return; }
  const load = () => applyRecord(rec);
  if (skipAsk) { load(); return; }
  openAsk(`記録（${rec.log.length}手）を読み込みます。今打っている対局は消え、設定と目標MAX布陣も記録のものに置き換わります。よろしいですか？`, { okLabel: '読み込む', onOk: load });
}
function applyRecord(rec) {
  state.maxLevels = rec.maxLevels;
  state.refillLevels = rec.refillLevels;
  state.diagonal = rec.diagonal;
  state.pvp = rec.pvp;
  state.increasingRecovery = rec.increasingRecovery;
  // 補充の入力のしかたは、読む人の好みなので変えない
  state.patterns = rec.patterns;
  // 最初の手の時点で目指していたMAX布陣: 起爆で切り替わった最初の手の、切り替わる前の布陣。
  // 切り替わりが記録に残っていなければ、一覧の一番上から(起爆すると自動で次へ移る)
  const firstSwitch = rec.log.find(e => e.targetBefore);
  const startId = firstSwitch ? firstSwitch.targetBefore : null;
  state.currentPatternId = state.patterns.some(p => p.id === startId) ? startId : null;
  state.game = defaultGame();
  state.game.start = rec.start;
  state.game.phase = 'move';
  state.game.practice = rec.practice;
  state.game.future = rec.log.map(e => { const c = Object.assign({}, e); delete c.targetBefore; return c; });
  state.board = cloneGrid(rec.init);
  picked = null; lastSearch = null;
  renderPatternList();
  moveNotice = '記録を読み込みました。進めるボタンで1手ずつ進められます。';
  onBoardChanged();
  showAdoptedCard();
}

const closePatterns = () => document.body.classList.remove('patterns-open');
document.getElementById('btnOpenPatterns').addEventListener('click', () => document.body.classList.add('patterns-open'));
document.getElementById('btnClosePatterns').addEventListener('click', closePatterns);
document.getElementById('sheetBackdrop').addEventListener('click', closePatterns);
document.getElementById('btnAutoSearch').addEventListener('click', () => {
  state.autoSearch = !state.autoSearch;
  saveState();
  renderAutoSearchBtn();
  // オンにしたとき、この盤面をまだ探していなければ、すぐ探す
  autoSkipKey = null;
  autoSearchAfterMove();
});
document.getElementById('chainDepth').addEventListener('change', () => { renderDock(); autoSearchAfterMove(); });   // 探す手数を変えたら、「自動：オン」なら探し直す
renderAutoSearchBtn();
refresh();
renderPatternList();
if (!SEARCH_IN_WORKER) loadChars();   // 登録したヒーローの絵を読み込んで、盤面に出す

</script>
</body>
</html>
