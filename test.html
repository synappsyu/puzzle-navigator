<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<title>EGG Navi</title>
<style>
  /* v3.0 の見た目(2026-10-03 本人OK): 卵の殻の白の地に、大事なボタンは黄身のイエロー。角を大きく丸め、影は薄く */
  :root {
    --bg: #fffaf0;
    --panel: #ffffff;
    --panel2: #f7f2e8;
    --border: #eee5d3;
    --text: #2d2a26;
    --text-dim: #8b8478;
    --accent: #ffc83d;
    --accent-ink: #3b2a00;
    --accent-soft: #fff1c7;
    --accent2: #2f7fe0;
    --danger: #e5484d;
    --mark: #ff1a1a;   /* 盤面の印(入替・削除の枠、✕、点線の枠) */
    --ok: #3cb371;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    font-size: 14px;
  }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--text); }
  .app { max-width: 1180px; margin: 0 auto; padding: 16px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
  header .sub { color: var(--text-dim); font-size: 12px; }
  header .sign { color: var(--text-dim); font-size: 11px; font-weight: normal; margin-left: 6px; }
  header .ver { color: var(--text-dim); font-size: 11px; font-weight: normal; margin-left: 4px; white-space: nowrap; }   /* 題名の横に小さく */
  /* 作った人と、アイデアをくれた人たち。狭い画面では「／」のあとで折り返す(言葉の途中では切らない) */
  header .credit { color: var(--text-dim); font-size: 11px; margin-top: 1px; }
  header .credit span { white-space: nowrap; }
  .layout { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  .col-left { flex: 1 1 460px; min-width: 320px; display:flex; flex-direction:column; gap:16px; }
  .col-right { flex: 1 1 380px; min-width: 300px; display:flex; flex-direction:column; gap:16px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .panel-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap: wrap; gap: 6px; }

  .board-wrap { position: relative; display:inline-block; }
  /* マスの大きさは中身(文字)で変わらないよう、6×6に等分する */
  .board {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-rows: repeat(6, minmax(0, 1fr));
    gap: 4px;
    width: 260px;
    max-width: calc(100vw - 48px);
    aspect-ratio: 1 / 1;
    touch-action: manipulation;
  }
  .cell {
    position: relative;
    border-radius: 6px;
    border: 2px solid transparent;
    display:flex; align-items:center; justify-content:center;
    color: #fff; font-weight: 700; font-size: 15px;
    cursor: pointer;
    user-select: none;
    transition: transform .06s ease;
    min-width: 0; min-height: 0; overflow: hidden;
  }
  .cell:active { transform: scale(0.94); }
  .cell.mini { font-size: 10px; border-radius: 3px; font-weight:600; }
  .cell.x { background: #33363f !important; color: var(--text-dim); font-weight:500; }
  .brush-row { display:flex; gap:5px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .brush-row .sw { width:30px; height:28px; border-radius:6px; border:2px solid transparent; color:#fff; font-weight:800; cursor:pointer; }
  .brush-row .sw.on { border-color:#fff; }
  .brush-row .sw.hero { background-size:88% auto !important; background-position:center !important; background-repeat:no-repeat !important; }
  .brush-row .lv { min-width:28px; padding:4px 0; }
  .brush-row .lv.on { border-color: var(--accent); color: var(--accent); font-weight:700; }
  .brush-row .row-break { display:none; }
  /* まだ何も入力されていないマス */
  .cell.empty {
    background: #202228;
    border: 2px dashed #4a4e5a !important;
    color: #6b7080; font-weight: 600; font-size: 11px;
  }
  .cell.unknown {
    background: repeating-linear-gradient(45deg, #3a3d2a, #3a3d2a 6px, #46492f 6px, #46492f 12px);
    color: var(--accent);
    border-color: var(--accent) !important;
    border-style: dashed !important;
  }
  .mini-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 30px; height: 22px; padding: 0 5px; border-radius: 5px;
    font-size: 11px; font-weight: 800; color: #fff; vertical-align: middle;
  }
  /* 入替の枠と削除の✕(入替と削除は✕の有無で見分ける)。枠は駒から少し離して外側に描く(赤い素材の駒の上でも見えるように) */
  .cell.highlight, .cell.highlight-del { border-color: transparent; box-shadow: 0 0 0 1px var(--panel), 0 0 0 4px var(--mark); }
  /* 入力間違いの確認で、見比べてほしいマス(入替の枠と見分けるため点線) */
  .cell.check-mark { border: 4px dashed var(--mark) !important; }
  /* 盤面を進める手を探すで、動かしてしまう「そろえたマス」(手順のあとの小さな盤面) */
  .cell.mini.break-mark { border: 3px dashed var(--mark) !important; }
  /* 手順のあとの盤面で、新しく目標MAX布陣の形どおりにそろうマス(盤面の金色の光と同じ色の枠) */
  .cell.mini.align-new { box-shadow: 0 0 0 1px var(--panel2), 0 0 0 3px rgb(255,184,0); z-index: 1; }   /* 駒の色と混ざらないよう、枠は駒の外側 */
  .cell.mini.highlight, .cell.mini.highlight-del { box-shadow: 0 0 0 1px var(--panel2), 0 0 0 3px var(--mark); }
  .cell .delx { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; color: var(--mark); text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 3px #000; }
  .cell.mini .delx { font-size:13px; }
  /* ピンの駒(「次の手を探す」で動かさない駒)。右上に印 */
  .cell .pin-mark { position:absolute; top:1px; right:1px; font-size:12px; line-height:1; pointer-events:none; }
  .cell.pinned { border: 2px dashed #fff; }
  /* 行き先付きのピン: ピンの駒と行き先のマスの左上に、同じ番号の丸を出す(駒の文字と重ならない大きさ) */
  .cell .dest-mark { position:absolute; left:1px; top:1px; width:12px; height:12px; box-sizing:border-box; border-radius:50%; background:#fff; color:#000; border:1px solid #000; font-size:8px; font-weight:900; line-height:10px; text-align:center; pointer-events:none; }
  .cell .dest-mark.low { top:auto; bottom:1px; }   /* 駒の番号と行き先の番号が同じマスに付くときは、行き先の番号を左下に */
    .cell.mini .pin-corner { position:absolute; top:0; right:0; width:0; height:0; border-style:solid; border-width:0 7px 7px 0; border-color:transparent var(--mark) transparent transparent; pointer-events:none; }   /* カードの小さい盤面のピン */
  .cell.pin-dest { box-shadow: inset 0 0 0 2px #fff; }
  .cell.pin-dest.highlight, .cell.pin-dest.highlight-del { box-shadow: inset 0 0 0 2px #fff, 0 0 0 1px var(--panel), 0 0 0 4px var(--mark); }   /* 行き先のマスでも、打つ手の赤枠を消さない(白い枠は内側、赤枠は外側) */
  .cell.dest-hover { box-shadow: inset 0 0 0 3px #fff; opacity: .8; }
  /* 目標MAX布陣にそろえたマス(列の上もそろったマス)を、まわりに金色の光がにじむようにゆっくり光らせる。
     光は隣の駒の上にも少しかかるので前に出す。入替・削除の枠と入力間違いの点線は、光より更に前に出す */
  @keyframes alignedGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,184,0,0); } 50% { box-shadow: 0 0 13px 6px rgba(255,184,0,1); } }
  @keyframes alignedGlowRing { 0%, 100% { box-shadow: 0 0 0 1px var(--panel), 0 0 0 4px var(--mark), 0 0 0 0 rgba(255,184,0,0); } 50% { box-shadow: 0 0 0 1px var(--panel), 0 0 0 4px var(--mark), 0 0 15px 8px rgba(255,184,0,1); } }
  .cell.aligned-glow { z-index: 1; animation: alignedGlow 2s ease-in-out infinite; }
  .cell.aligned-glow.highlight, .cell.aligned-glow.highlight-del { animation-name: alignedGlowRing; }
  .cell.highlight, .cell.highlight-del, .cell.check-mark { z-index: 2; }
  /* 練習モードでマッチの様子を見せる場面: そろったマスは白く強く光って少し小さくなる。消えたマスは暗い空き */
  /* マッチした駒・長押しで削除する駒: 駒だけを白く光らせて縮める。白い四角の光は、明るい板の上では四角い枠に見えたので出さない(2026-10-03 本人) */
  .cell.match-flash { filter: brightness(2); transform: scale(.82); transition: transform .15s; z-index: 1; }
  .cell.gone { background: #202228; }
  /* 1手戻したときに、その場面で「この手順を打つ」を押したカードに付ける印 */
  .adopted-mark { display:inline-block; font-size:12px; font-weight:700; color:#1b1d24; background:var(--accent); border-radius:5px; padding:2px 8px; margin-bottom:6px; }
  /* 手を打っている間の盤面: 指でなぞっても画面をスクロールしない(ドラッグの入替・長押しの削除のため)。長押しでメニューや文字選びを出さない */
  .board.play, .board.pin-mode { touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; }
  /* ドラッグ中: 元のマスは空いたように暗く、駒は指(マウス)に付いて動く */
  .cell.drag-origin { background: #202228 !important; color: transparent !important; }
  .drag-piece { position: fixed; z-index: 50; pointer-events: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; box-shadow: 0 4px 10px rgba(40,20,60,.35); transform: translate(-50%, -50%) scale(1.08); }
  /* 盤面の外で離すと削除になる間: 長押しの削除と同じ白い光 */
  .drag-piece.drag-delete { filter: brightness(2); box-shadow: inset 0 0 18px 14px #fff, 0 0 12px 5px #fff; transform: translate(-50%, -50%) scale(.82); }
  /* 長押し: 光り始めてから削除までに、「そろったマスが白く光って少し小さくなる」強さまで強くなる */
  @keyframes pressGlow { 0% { filter: brightness(1); transform: scale(1); } 100% { filter: brightness(2); transform: scale(.82); } }
  .cell.press-glow { animation: pressGlow 1333ms ease-in forwards; z-index: 1; }
  .practice-label { color: var(--accent); font-weight: 700; }

  .toolbar { display:flex; gap:8px; margin-top:10px; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: 13px; cursor: pointer;
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 12px;
  }
  button:hover { border-color: var(--accent2); }
  button.primary { background: var(--accent); color:#1b1d24; border-color: var(--accent); font-weight:700; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--danger); border-color: var(--danger); background:transparent; }
  button.small { padding: 4px 8px; font-size:12px; }
  /* 記録の書き出し・読み込みは、ふだんは使わないので目立たせない */
  button.quiet { color: var(--text-dim); border-color: transparent; background: transparent; font-size:12px; padding: 6px 8px; }
  button.quiet:hover { border-color: var(--border); color: var(--text); }
  button:disabled, button.dim { opacity:.4; cursor:default; }
  .toolbar button.on { border-color: var(--accent); color: var(--accent); font-weight:700; }

  .tag { display:inline-block; padding:1px 7px; border-radius:20px; font-size:11px; font-weight:700; margin-left:6px; }
  .note { color: var(--text-dim); font-size:12px; margin-top:8px; }

  .mini-board { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); grid-template-rows:repeat(6, minmax(0, 1fr)); gap:2px; width:170px; aspect-ratio:1/1; }
  /* 手順のカード */
  .chain-card { border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:10px; background: var(--panel2); }
  .chain-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  /* カードの番号(2026-10-03 本人「どの手順を検討してたか盤面に戻ると分からなくなる」)。見出しより目立たないように小さく灰色で、印と同じ行に並べる */
  .card-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:-3px 0 3px; }
  .card-top .adopted-mark { margin-bottom:0; }
  .card-no { font-size:11px; font-weight:700; color:var(--text-dim); }
  .chain-gain { font-size:20px; font-weight:800; color: var(--accent2); }
  .chain-meta { font-size:12px; color: var(--text-dim); }
  .chain-head .head-nums { flex-basis:100%; }   /* 数字の行(使う手数など)は、どのカードも見出しの次の行に出す */
  .chain-steps { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .chain-step h4 { font-size:11px; color: var(--text-dim); margin:0 0 3px; font-weight:600; }
  .chain-arrow { color: var(--text-dim); font-size:16px; }
  .mini-board.chain { width:108px; }   /* 3手の手順でも、各手の前の盤面3つと手順の後の盤面が1列に並ぶ幅 */
  .chain-chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:6px; font-size:12px; color: var(--text-dim); }
  .chain-chip { display:inline-flex; align-items:center; gap:3px; }
  /* 事故の確率(5%以上) */
  .card-warns { margin:0 0 8px; }
  .card-warn { color: var(--danger); font-size:13px; font-weight:700; margin:2px 0; }

  .pattern-card { border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:8px; background: var(--panel2); }
  .pattern-order { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:6px; }
  .pattern-order button { margin-left:4px; }
  .pattern-tools { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .pattern-card-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .pattern-card-head .name { font-weight:700; }
  .pattern-card-body { display:flex; gap:10px; margin-top:8px; align-items:center; }
  .species-pill { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:5px; color:#fff; font-weight:800; font-size:11px; }
  .species-pill.named { width:auto; padding:0 6px; white-space:nowrap; }

  .config-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; }
  .config-item { display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
  .config-item label { display:flex; align-items:center; gap:6px; font-weight:700; }
  .config-item input { width:56px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 6px; font-size:13px; }

  /* 盤面は、ゲームと同じく市松模様の板の上に駒を置く形(2026-10-03 本人と決めた。ヒーローを選んでいてもいなくても同じ)。
     板の色は .board の背景(2マス×2マスの模様をくり返す)、駒はマスより一回り小さく置く(マスの外側のすき間に板が見える) */
  #board, .mini-board.chain { gap: 0; background: repeating-conic-gradient(#cdc4db 0 25%, #e7e1ef 0 50%) 0 0 / calc(100% / 3) calc(100% / 3); }
  #board { border-radius: 14px; }
  .mini-board.chain { border-radius: 5px; }
  #board .cell { margin: 7%; }
  .mini-board.chain .cell { margin: 6%; }
  #board .cell.gone { background: transparent; }
  #board .cell.drag-origin { background: transparent !important; }
  /* 明るい板の上の枠: 前の暗い盤面では、駒と枠の間に背景と同じ暗い色の線を入れてすき間に見せていたが、明るい板では黒い線に見えるのでやめる(2026-10-03 本人)。
     ピンの点線・行き先の枠は、白では明るい板の上で見えにくいので、濃い紫にする */
  #board .cell.highlight, #board .cell.highlight-del { box-shadow: 0 0 0 3px var(--mark); }
  #board .cell.pinned { border-color: #4b2f7a; }
  /* 行き先のマスは、番号の丸だけで示す(枠は付けない。2026-10-03 本人「番号だけの方がノイズが少ない」) */
  #board .cell.pin-dest { box-shadow: none; }
  #board .cell.pin-dest.highlight, #board .cell.pin-dest.highlight-del { box-shadow: 0 0 0 3px var(--mark); }
  /* 削除の✕の縁: 黒い縁は明るい板の上で重く見えるので、白い細い縁にする(赤い駒の上でも✕の形が分かる) */
  #board .cell .delx, .mini-board.chain .cell .delx { text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff; }
  #board .cell.dest-hover { box-shadow: inset 0 0 0 3px #4b2f7a; }
  #board .cell.aligned-glow.highlight, #board .cell.aligned-glow.highlight-del { animation-name: alignedGlowRingLight; }
  @keyframes alignedGlowRingLight { 0%, 100% { box-shadow: 0 0 0 3px var(--mark), 0 0 0 0 rgba(255,184,0,0); } 50% { box-shadow: 0 0 0 3px var(--mark), 0 0 15px 8px rgba(255,184,0,1); } }
  .mini-board.chain .cell.mini.highlight, .mini-board.chain .cell.mini.highlight-del { box-shadow: 0 0 0 2px var(--mark); }
  .mini-board.chain .cell.mini.align-new { box-shadow: 0 0 0 2px rgb(255,184,0); }
  /* 線の絵の印(ツールの中で描くので、機種によって見た目が変わらない。2026-10-03) */
  .ico { width: 16px; height: 16px; vertical-align: -3px; margin-right: 5px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ico-pin { width: 13px; height: 13px; display: block; }
  .ico-warn { width: 1.05em; height: 1.05em; vertical-align: -0.15em; margin-right: 3px; }
  /* ヒーローの絵(2026-10-03) */
  .cell.char { text-shadow: none; }
  .char-rows { display:flex; flex-direction:column; gap:8px; margin:10px 0; }
  .char-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
  .char-row label { display:flex; align-items:center; gap:6px; font-weight:700; }
  .char-thumbs { display:flex; gap:3px; flex-wrap:wrap; }
  .char-thumb { display:inline-block; width:30px; height:30px; border-radius:5px; border:2px solid transparent; }
  .char-thumb.sel { border-color: var(--mark); }
  .char-buttons { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 6px; }
  .char-review { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
  .char-review .char-cell { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; }
  .char-review .char-thumb { width:56px; height:56px; cursor:pointer; }
  .char-item { background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:8px; }
  .char-item-head { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .char-msg { color: var(--danger); min-height: 1.2em; }
  .crop-wrap { position:relative; width:100%; max-width:320px; margin:10px auto; touch-action:none; user-select:none; -webkit-user-select:none; overflow:hidden; }
  .crop-img { display:block; width:100%; height:auto; }
  .crop-frame { position:absolute; border:3px solid var(--mark); box-shadow: 0 0 0 9999px rgba(0,0,0,.45); cursor:move; touch-action:none; }
  .crop-size { display:flex; align-items:center; gap:8px; justify-content:center; font-size:13px; }
  .crop-size input { width:180px; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding: 16px; }
  .modal { background: var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px; max-width:520px; width:100%; max-height:90vh; overflow:auto; }
  .modal h2 { margin-bottom:12px; }
  .modal p { line-height:1.7; }
  .field-row { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .field-row input[type=text] { flex:1; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:7px 10px; font-size:13px; min-width:120px; }
  .species-selector { display:flex; gap:6px; }
  .species-btn { width:34px; height:34px; border-radius:8px; border:2px solid transparent; color:#fff; font-weight:800; cursor:pointer; }
  .species-btn.active { border-color: #fff; }
  .species-btn.named { width:auto; padding:0 10px; white-space:nowrap; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .modal select { background: var(--panel2); color: var(--text); border:1px solid var(--border); border-radius:6px; padding:3px 6px; }
  .info-modal ul, .info-modal ol { margin:6px 0 10px; padding-left:1.4em; line-height:1.8; }
  .ask-text { white-space: pre-line; }

  footer { text-align:center; color: var(--text-dim); font-size:11px; margin-top:24px; padding-bottom:20px; }

  .moves-left { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:0 0 8px; }
  .moves-left .num { font-size:28px; font-weight:800; color: var(--accent2); }
  .game-status { font-size:13px; line-height:1.6; margin:0 0 8px; }
  .shortage-line { font-size:13px; line-height:1.6; margin:-4px 0 8px; }
  .help-btn { vertical-align: middle; }
  /* 枠の見出しと「<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.6v.01"/></svg>説明」を並べる。幅が狭いときは、見出しを折らずに右のボタンを次の行に回す */
  .panel-title { display:flex; align-items:center; gap:8px; }
  .panel-title h2 { margin:0; }
  .panel-title h2, .panel-title .help-btn { white-space: nowrap; }
  .panel-head > div:not(.panel-title) { white-space: nowrap; }
  /* はじめての方へ(使い方の流れ) */
  .guide { border:1px solid var(--border); border-radius:8px; background: var(--panel2); padding:8px 12px; margin:0 0 12px; font-size:13px; }
  .guide summary { cursor:pointer; font-weight:700; }
  .guide ol { margin:4px 0 6px; padding-left:1.4em; line-height:1.7; }
  .guide .guide-lead { margin:8px 0 4px; }
  .guide ol ul { margin:2px 0 4px; padding-left:1.3em; list-style: disc; }
  .guide .guide-h { margin:12px 0 0; padding-top:10px; border-top:1px solid var(--border); font-weight:700; }
  /* 「手順を探す」の2つのボタンの違い */
  .warn-why { margin-top:4px; }
  .warn-why summary { cursor:pointer; color: var(--text-dim); font-size:12px; }
  .warn-why ul { margin:4px 0 0; padding-left:1.4em; line-height:1.7; }
  /* 画面の下に貼り付けるボタン(2026-09-29 本人が見本で選んだ)。「盤面へ／結果へ」は右下の金色の丸、「上位◯件だけ表示」は左下の金色の横長 */
  .fab-round { position:fixed; right:16px; bottom:14px; z-index:60; width:60px; height:60px; padding:0; border-radius:50%; border:none; background:var(--accent); color:#1b1d24; box-shadow:0 4px 14px #000a; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; }
  .fab-round .ar { font-size:22px; font-weight:700; }
  .fab-round .t { font-size:11px; font-weight:700; margin-top:3px; }
  .fab-pill { position:fixed; left:16px; bottom:20px; z-index:60; display:flex; align-items:center; height:48px; padding:0 22px; border-radius:24px; border:none; background:var(--accent); color:#1b1d24; font-size:16px; font-weight:700; white-space:nowrap; box-shadow:0 4px 14px #000a; }
  .warn-note { border:1px solid var(--danger); border-radius:6px; padding:6px 10px; margin:0 0 8px; font-size:12px; color: var(--text); background: rgba(224,87,76,.08); }
  .warn-note b { color: var(--danger); }
  /* 説明と設定の■の見出し。上に細い区切り線(題名のすぐ下と、「詳しく…」を開いたすぐ下の見出しには引かない) */
  .sec-h { font-weight:700; margin:16px 0 4px; padding-top:12px; border-top:1px solid var(--border); }
  .modal h2 + .sec-h, .warn-why > summary + .sec-h { margin-top:4px; padding-top:0; border-top:none; }
  .cfg-h { font-size:14px; margin:16px 0 4px; }   /* プリセットの一覧の見出し(斜め移動なし・あり) */
  /* 設定のチェック・選択の枠(色・レベルの枠と同じ見た目)。チェックや丸いボタンは文の1行目にそろえる */
  .cfg-box { background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-top:10px; }
  .cfg-box .cfg-sub { font-weight:700; margin-bottom:6px; }
  .cfg-box .opt { display:flex; align-items:flex-start; gap:8px; font-weight:700; }
  .cfg-box .opt + .opt { margin-top:6px; }
  .cfg-box .opt input { margin:3px 0 0; flex:none; }
  .cfg-box .note { margin-top:6px; }

  .toolbar-break { display: none; }   /* ヘッダーのボタンの折り返し(スマホだけ使う) */
  /* スマホなど幅の狭い画面 */
  @media (max-width: 720px) {
    /* 16px より小さい入力欄は、iPhone で押すと画面が拡大されるので大きくする */
    input, select, textarea, .config-item input, .field-row input[type=text] { font-size: 16px; }
    /* シミュレーターは 素材とレベル → 盤面 → 操作 の順に並べる(入力と確定のあいだのスクロールを減らす) */

    .brush-row .sw { width:36px; height:34px; }
    .brush-row .lv { min-width:30px; padding:7px 0; }
    .brush-row .row-break { display:block; flex-basis:100%; height:0; }
    .mini-board.chain { width: 128px; }
    /* 手順の小さい盤面は2つずつ並べる(矢印は隠す。各盤面の見出しの①②で順番が分かる) */
    .chain-arrow { display: none; }
    .chain-steps { gap: 10px; }
    .config-grid { grid-template-columns: 1fr; }
    /* ヘッダーのボタンは「設定・リセット」と「記録を書き出す・読み込む」の2行に分ける */
    .toolbar-break { display: block; flex-basis: 100%; height: 0; }
  }

  /* ================= v3.0 の見た目と配置 ================= */
  html, body { font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
  .app { max-width: 1440px; padding: 10px 16px 24px; }
  h2 { font-size: 15px; font-weight: 800; }
  /* 上の帯: 名前とアイコン2つ(ヒーロー・メニュー) */
  header.topbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: nowrap; gap: 8px; margin: 0 0 10px; }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .brand h1 { font-size: 17px; font-weight: 800; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .egg { flex: none; width: 24px; height: 28px; border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%; background: #fff; box-shadow: inset 0 -3px 0 #f1e6cf, 0 1px 3px #0002; position: relative; }
  .egg::after { content: ""; position: absolute; left: 6px; top: 10px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .top-icons { display: flex; gap: 8px; flex: none; }
  .icon-btn { width: 42px; height: 42px; padding: 0; border-radius: 14px; display: grid; place-items: center; }
  .icon-btn .ico { width: 20px; height: 20px; margin: 0; }
  /* ボタン */
  button { font-family: inherit; font-size: 13px; font-weight: 700; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 9px 14px; box-shadow: 0 1px 2px #0000000a; }
  button:hover { border-color: #e2d4b4; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 3px 10px #f5a40033; }
  button.primary:hover { filter: brightness(1.03); }
  button.danger { color: var(--danger); border-color: #f4c9c9; background: var(--panel); }
  button.small { padding: 6px 10px; font-size: 12px; border-radius: 10px; }
  button.quiet { background: transparent; border-color: transparent; box-shadow: none; color: var(--text-dim); }
  .toolbar button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
  input, select, textarea { font-family: inherit; }
  select, .config-item input, .field-row input[type=text], input[type=number] { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; }
  .modal select { background: var(--panel); color: var(--text); border-radius: 10px; padding: 5px 8px; }
  .note { color: var(--text-dim); }
  /* 説明のボタンは丸い「?」 */
  .help-btn { width: 28px; height: 28px; padding: 0; border-radius: 50%; display: inline-grid; place-items: center; background: var(--panel2); border: none; box-shadow: none; color: var(--text-dim); font-weight: 800; font-size: 14px; }
  /* 3つのゾーン: 枠の箱にせず、見出しと中身だけ */
  .panel { background: transparent; border: none; border-radius: 0; padding: 0; }
  .panel-head { margin-bottom: 8px; }
  .layout { display: grid; grid-template-columns: 1fr; gap: 18px; }
  .col-left, .col-right { display: contents; }
  #simPanel { grid-area: sim; } #chainPanel { grid-area: chain; } #patternPanel { grid-area: pattern; }
  .layout { grid-template-areas: "sim" "chain"; }
  #patternPanel { display: none; }
  /* 残り手数と目標MAX布陣の残りの数: 白いカード */
  #statusArea { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 10px 16px; margin: 0 0 10px; }
  #statusArea:empty { display: none; }
  #statusArea .moves-left { margin: 0; align-items: baseline; }
  #statusArea .moves-left .num { font-size: 34px; color: var(--text); letter-spacing: -1px; }
  #statusArea .shortage-line { margin: 2px 0 0; font-size: 12.5px; font-weight: 700; }
  .game-status { color: var(--text-dim); font-size: 12.5px; }
  /* 盤面 */
  .board-wrap { display: block; }
  .board { width: 100%; max-width: 460px; margin: 0 auto; }
  #board { border-radius: 20px; box-shadow: 0 0 0 1px #d8cfe6; }
  .cell.empty { background: #f3eee4; border: 2px dashed #d8ccb8 !important; color: #b0a796; }
  /* 「?」のマス: 明るい板の上で重く見えないよう、白い駒に薄い紫の点線と「?」 */
  .cell.unknown { background: #fffdf9; color: #9c90b8; border-color: #b9aed0 !important; font-weight: 800; }
  .cell.x { background: #efe9dd !important; color: #b0a796; }
  .cell.gone, .cell.drag-origin { background: #efe9dd; }
  .brush-row { margin: 0 0 10px; }
  .brush-row .sw { border-radius: 10px; padding: 0; display: inline-grid; place-items: center; line-height: 1; }
  /* Lv と「?」はひとまとまり。入り切らないときは、まとめて次の行へ送る */
  .brush-row .lv-group { display: inline-flex; align-items: center; gap: 3px; flex-wrap: nowrap; }
  .brush-row { gap: 4px; }
  .brush-row .note { margin-top: 0; }   /* 「素材」「Lv」の文字をボタンの高さの真ん中に */
  @media (min-width: 720px) { .brush-row .lv { min-width: 26px; } }   /* PC では素材から「?」までを1行に収める */
  .brush-row .sw.on { border-color: var(--text); }
  .brush-row .lv { border-radius: 10px; }
  .brush-row .lv.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
  /* 入替・削除・ピン・盤面を直す: iPhone の切り替えボタンの形。戻す・進めるは丸いボタン */
  .mode-row { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px; }
  .seg { flex: 1; display: flex; background: var(--panel2); border-radius: 14px; padding: 3px; min-width: 0; }
  .seg button { flex: 1; min-width: 0; border: none; background: transparent; box-shadow: none; border-radius: 11px; padding: 9px 2px; font-size: 13px; color: #6b6458; white-space: nowrap; display: flex; align-items: center; justify-content: center; }
  .seg button .ico { margin-right: 3px; }
  .seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px #0002; }
  .round-btn { width: 42px; height: 42px; padding: 0; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .round-btn .ico { margin: 0; width: 18px; height: 18px; }
  /* 結果のカード */
  .chain-card, .pattern-card { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 14px 16px; margin-bottom: 12px; }
  .chain-gain { color: var(--text); }
  .card-warn { background: #fff4e5; color: #c2410c; border-radius: 10px; padding: 6px 10px; margin: 4px 0; font-size: 12.5px; }
  .adopted-mark { color: var(--accent-ink); background: var(--accent); border-radius: 8px; }
  .warn-note { background: #fff1f0; border-color: #f4c9c9; border-radius: 12px; }
  .config-item, .cfg-box, .char-row, .char-item, .guide { background: #fbf7ef; border: 1px solid var(--border); border-radius: 14px; }
  .mini-badge { border-radius: 7px; }
  /* 小さい画面の部品 */
  .overlay { background: rgba(45, 42, 38, .32); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .modal { background: var(--bg); border: none; border-radius: 24px; box-shadow: 0 20px 50px #0003; padding: 20px; }
  .sec-h { border-top-color: var(--border); }
  footer { color: var(--text-dim); }
  footer .credit { margin-top: 6px; }
  /* メニュー(≡) */
  /* 小さな画面の右上の ✕(スクロールしても上に残る) */
  .modal-x { position: sticky; top: 0; z-index: 3; float: right; width: 34px; height: 34px; padding: 0; border-radius: 50%; display: grid; place-items: center; margin: -6px -6px 0 8px; background: var(--panel2); border: none; box-shadow: 0 1px 4px #0001; color: var(--text-dim); }
  .modal-x .ico { margin: 0; width: 18px; height: 18px; }
  .menu-list { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 4px; }
  .menu-list button { display: flex; align-items: center; gap: 10px; justify-content: flex-start; padding: 13px 14px; font-size: 14px; border-radius: 14px; text-align: left; }
  .menu-list button .ico { margin: 0; width: 18px; height: 18px; }
  .menu-list button.danger { color: var(--danger); }
  /* 目標MAX布陣を、スマホとタブレットでは下から出す画面で開く */
  #sheetBackdrop { display: none; position: fixed; inset: 0; z-index: 89; background: rgba(45, 42, 38, .32); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  body.patterns-open #sheetBackdrop { display: block; }
  body.patterns-open #patternPanel { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 90; max-height: 86vh; overflow: auto; background: var(--bg); border-radius: 24px 24px 0 0; padding: 18px 16px 28px; box-shadow: 0 -10px 40px #0003; }
  #btnClosePatterns { display: none; }
  body.patterns-open #btnClosePatterns { display: inline-block; }
  /* 画面の下のボタン(スマホだけ。親指が届く所) */
  #dock { display: none; }
  /* 古い帯の部品(v3.0 の文の見直しで消す) */
  header .sub, #quickGuide { display: none; }

  /* 説明の「詳しく」(押すと開く) */
  details.more { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
  details.more > summary { cursor: pointer; font-weight: 800; font-size: 14px; color: var(--text); }
  details.more details.more { border-top: none; margin-top: 8px; padding-top: 0; }
  .info-modal .lead { margin-top: 0; }
  /* 目標MAX布陣のカードの「その他の操作」 */
  details.pattern-more { margin-top: 8px; }
  details.pattern-more > summary { cursor: pointer; font-size: 12px; font-weight: 700; color: var(--text-dim); }
  /* 残り手数のカード: 右上に「リセット」と「?」、下にゲームモード */
  #statusArea::after { content: ""; display: block; clear: both; }
  #statusArea .card-tools { float: right; display: flex; align-items: center; gap: 6px; margin: 0 -6px 4px 10px; }
  #statusArea .card-tools #btnResetGame { padding: 0 10px; height: 28px; }
  /* 右上のボタンの横に1行目が並ぶよう、残り手数の行は普通の文の並びにする(括弧の中は次の行) */
  #statusArea .moves-left { display: block; }
  #statusArea .moves-left .note { display: block; margin-top: 0; }
  #statusArea .moves-left .practice-label { margin-left: 8px; }
  .nobr { display: inline-block; }   /* 改行するなら、この言葉の前で */
  #statusArea .rule-note { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  #statusArea .rule-note:empty { display: none; }
  #statusArea .game-status { margin: 4px 0; color: var(--text); font-weight: 700; }
  #simPanel > .panel-head { display: none; }
  /* 目標MAX布陣の残りの数: 小さな札 */
  .short-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
  .short-chips span { background: var(--panel2); border-radius: 999px; padding: 1px 9px; font-size: 11.5px; font-weight: 700; color: #5d564b; }
  .short-chips span.done { color: var(--text-dim); font-weight: 500; }
  footer .disclaimer { margin-top: 6px; }
  /* ---------- スマホ ---------- */
  @media (max-width: 719px) {
    .app { padding-bottom: 110px; }
    #dock:not(:empty) { display: flex; gap: 10px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(255, 250, 240, 0), var(--bg) 38%); }
    #dock button { height: 56px; border-radius: 18px; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; }
    #dock button.primary { flex: 1; }
    #dock button .ico { margin: 0; width: 20px; height: 20px; }
    #dock button small { font-size: 11px; opacity: .7; }
    .in-dock { display: none !important; }
    .fab-round { bottom: 96px; }
    .fab-pill { bottom: 102px; }
    .overlay { align-items: flex-end; padding: 0; }
    .modal { border-radius: 24px 24px 0 0; max-height: 88vh; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
    .board { width: 100%; max-width: none; }
  }
  /* ---------- タブレット: 左に盤面、右に結果(盤面は画面に止めておく) ---------- */
  @media (min-width: 720px) {
    .layout { grid-template-columns: minmax(330px, 440px) minmax(0, 1fr); grid-template-areas: "sim chain"; align-items: start; }
    #simPanel { position: sticky; top: 10px; }
  }
  /* 「素材」「連鎖」のタブ: 切り替えの形 */
  #chainList .toolbar:has(> [data-result-tab]) { display: inline-flex; gap: 0; background: var(--panel2); border-radius: 12px; padding: 3px; }
  button[data-result-tab] { background: transparent; border: none; box-shadow: none; color: #6b6458; border-radius: 9px; padding: 6px 16px; font-size: 13px; }
  button[data-result-tab].primary { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px #0002; }
  /* カードの小さい盤面: 手順の盤面と手順の後を並べる(矢印は出さない。見出しの①②で順番が分かる) */
  .chain-arrow { display: none; }
  .chain-steps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .chain-steps .mini-board.chain { width: 100%; }
  @media (min-width: 720px) { .chain-steps { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  /* タブレットと PC: 「次の手を探す」は結果の上に大きく(スマホは画面の下のボタン) */
  @media (min-width: 720px) {
    #btnSearch { flex: 1 1 100%; height: 52px; font-size: 16px; border-radius: 18px; }
  }
  /* ---------- PC: 右に目標MAX布陣も並べる ---------- */
  @media (min-width: 1200px) {
    .layout { grid-template-columns: 440px minmax(0, 1fr) 320px; grid-template-areas: "sim chain pattern"; }
    #patternPanel { display: block; position: sticky; top: 10px; }
    #btnOpenPatterns { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="egg" aria-hidden="true"></span><h1>EGG Navi <span class="ver">v2.2.31</span></h1></div>
    <div class="top-icons">
      <button id="btnChars" class="icon-btn" title="ヒーロー" aria-label="ヒーロー"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></button>
      <button id="btnMenu" class="icon-btn" title="メニュー" aria-label="メニュー"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>
  <!-- メニュー(≡): 目標MAX布陣・設定・記録 -->
  <div id="menuOverlay" class="overlay" style="display:none;"><div class="modal" id="menuModal">

<script>
"use strict";

/* ============================== 定数 ============================== */
const SPECIES = ['A', 'B', 'C', 'D'];
const SIZE = 6;
// 素材の色。設定の「素材の色」で、A〜Dそれぞれに系統を選ぶ(ゲーム画面の色に合わせて入力ミスを減らすため)。

const COLOR_FAMILIES = {
  blue:   { name: '青', stops: ['#bfe3ff', '#2f7fe0', '#0b2a6e'] },
  red:    { name: '赤', stops: ['#ffc9d2', '#e0443c', '#6a0f16'] },
  green:  { name: '緑', stops: ['#d6f5a8', '#3aa35a', '#0f4a24'] },
  yellow: { name: '黄', stops: ['#fff3b8', '#f2c230', '#8a5a00'] },
  black:  { name: '黒', stops: ['#8c8c8c', '#474747', '#000000'] },
  white:  { name: '白', stops: ['#ffffff', '#dadada', '#aaaaaa'] },
  purple: { name: '紫', stops: ['#e6d6ff', '#8e4fd9', '#3a1270'] },
};
const DEFAULT_SPECIES_COLORS = { A: 'blue', B: 'red', C: 'green', D: 'yellow' };
// レベルに関係なく1色で表示するところ(色の選択ボタン・布陣の絵など)に使う色。applySpeciesColors() で設定から作り直す。
const SPECIES_COLOR_HEX = { A: '#2f7fe0', B: '#e0443c', C: '#3aa35a', D: '#f2c230' };
function hexToRgb(hex) { const h = hex.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
// 背景の明るさに合わせた文字の色(明るい色には黒、暗い色には白)
function textOn(color) {
  const m = /rgb\((\d+),\s*(\d+),\s*(\d+)\)/.exec(color);
  const [r, g, b] = m ? [+m[1], +m[2], +m[3]] : hexToRgb(color);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.62 ? '#111' : '#fff';
}
function speciesFamily(species) {
  const key = (typeof state !== 'undefined' && state && state.speciesColors && state.speciesColors[species]) || DEFAULT_SPECIES_COLORS[species];
  return COLOR_FAMILIES[key] || COLOR_FAMILIES.blue;
}
function applySpeciesColors() {
  for (const sp of ['A', 'B', 'C', 'D']) SPECIES_COLOR_HEX[sp] = speciesFamily(sp).stops[1];
}

/* ============================== 盤面の計算 ==============================
 * 盤面を「6×6の平坦な数値配列」で持ち、縦・横の2回の走査でマッチを探して処理する。
 */
function cloneGrid(grid) {
  return grid.map(row => row.map(c => (c ? { species: c.species, level: c.level } : null)));
}
// '?' は入力を省いたマス。どの駒ともマッチしない駒として扱う。
// maxLevelsToIdx が '?' の最大レベルとして0を返すので、detectRuns の `l < maxLvByIdx[s]` が必ず偽になり、並んでもマッチにならない。
const SPECIES_INDEX = { A: 0, B: 1, C: 2, D: 3, '?': 4 };
const SPECIES_NAME = ['A', 'B', 'C', 'D', '?'];

function flatFromGrid(grid, sp, lv) {
  for (let y = 0; y < SIZE; y++) {
    const row = grid[y];
    for (let x = 0; x < SIZE; x++) {
      const i = y * SIZE + x; const c = row[x];
      if (!c) { sp[i] = -1; lv[i] = 0; }
      else { sp[i] = SPECIES_INDEX[c.species]; lv[i] = c.level; }
    }
  }
}
function gridFromFlat(sp, lv, fl) {
  const grid = new Array(SIZE);
  for (let y = 0; y < SIZE; y++) {
    const row = new Array(SIZE);
    for (let x = 0; x < SIZE; x++) {
      const i = y * SIZE + x;
      if (sp[i] < 0) row[x] = null;
      else if (fl && fl[i]) row[x] = { species: SPECIES_NAME[sp[i]], level: lv[i], filled: true };
      else row[x] = { species: SPECIES_NAME[sp[i]], level: lv[i] };
    }
    grid[y] = row;
  }
  return grid;
}
// マッチする並びを探す。返す順序:
//   種類(A,B,C,D)→ レベル昇順 → 縦の並び(列昇順・行昇順)→ 横の並び(行昇順・列昇順)
function detectRuns(sp, lv, maxLvByIdx) {
  const runs = [];
  for (let x = 0; x < SIZE; x++) {
    let start = 0;
    for (let y = 1; y <= SIZE; y++) {
      const ip = (y - 1) * SIZE + x;
      const same = y < SIZE && sp[ip] >= 0 && sp[y * SIZE + x] === sp[ip] && lv[y * SIZE + x] === lv[ip];
      if (!same) {
        const len = y - start;
        if (len >= 3) {
          const i0 = start * SIZE + x; const s = sp[i0]; const l = lv[i0];
          if (s >= 0 && l >= 1 && l < maxLvByIdx[s]) {
            const cells = new Array(len);
            for (let k = 0; k < len; k++) cells[k] = (start + k) * SIZE + x;
            // ord はマッチを処理する順番。同じ長さなら横の並びが先(縦は100を足してある)。
            runs.push({ key: s * 32 + l, len, level: l, spIdx: s, cells, ord: 100 + x * 10 + start });
          }
        }
        start = y;
      }
    }
  }
  for (let y = 0; y < SIZE; y++) {
    const base = y * SIZE;
    let start = 0;
    for (let x = 1; x <= SIZE; x++) {
      const ip = base + x - 1;
      const same = x < SIZE && sp[ip] >= 0 && sp[base + x] === sp[ip] && lv[base + x] === lv[ip];
      if (!same) {
        const len = x - start;
        if (len >= 3) {
          const i0 = base + start; const s = sp[i0]; const l = lv[i0];
          if (s >= 0 && l >= 1 && l < maxLvByIdx[s]) {
            const cells = new Array(len);
            for (let k = 0; k < len; k++) cells[k] = base + start + k;
            runs.push({ key: s * 32 + l, len, level: l, spIdx: s, cells, ord: 0 + y * 10 + start });
          }
        }
        start = x;
      }
    }
  }
  if (runs.length > 1) runs.sort((a, b) => a.key - b.key); // 安定ソート: 同じ種類・レベルでは縦が先
  return runs;
}
function mergeRunStandard(run, lv, ov) {
  const ids = run.cells; const n = ids.length;
  const first = ids[0], last = ids[n - 1];
  let overlapCount = 0;
  for (let i = 1; i < n - 1; i++) if (ov[ids[i]]) overlapCount++;
  for (let i = 1; i < n - 1; i++) {
    const s = ids[i];
    if (!ov[s]) { lv[s] = run.level + 1; ov[s] = 1; }
  }
  if (overlapCount === 1) {
    if (ov[first]) { lv[last] = run.level + 1; ov[last] = 1; }
    else {
      lv[first] = run.level + 1; ov[first] = 1;
      if (!ov[last]) lv[last] = -1;
    }
  } else if (overlapCount > 1) {
    lv[first] = run.level + 1; ov[first] = 1;
    lv[last] = run.level + 1; ov[last] = 1;
  } else {
    if (!ov[first]) lv[first] = -1;
    if (!ov[last]) lv[last] = -1;
  }
}
// lv === -1 のマスを取り除き、同じ列の下のマスを上に詰める。
function compactFlat(sp, lv) {
  for (let x = 0; x < SIZE; x++) {
    let w = 0;
    for (let y = 0; y < SIZE; y++) {
      const i = y * SIZE + x;
      if (sp[i] >= 0 && lv[i] !== -1) {
        if (w !== y) { const j = w * SIZE + x; sp[j] = sp[i]; lv[j] = lv[i]; }
        w++;
      }
    }
    for (let y = w; y < SIZE; y++) { const j = y * SIZE + x; sp[j] = -1; lv[j] = 0; }
  }
}
// 行の若い順・列の若い順に補充する。
function refillFlat(sp, lv, fl, rng) {
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
    const i = y * SIZE + x;
    if (sp[i] < 0) { sp[i] = SPECIES_INDEX[rng.pickSpecies()]; lv[i] = refillLevelOf(sp[i]); fl[i] = 1; }
  }
}
function runsValueDelta(runs, coefficient) {
  let delta = 0;
  for (const r of runs) {
    const L = r.len;
    const consumed = L * levelValue(r.level, coefficient);
    const producedCount = L === 3 ? 1 : (L - 2);
    delta += producedCount * levelValue(r.level + 1, coefficient) - consumed;
  }
  return delta;
}
// 1回の呼び出しが1回分(1ラウンド)のマッチ。回の区切り(その回の最初の位置)を out.rounds に積む(advancePenalty が使う)。
function pushEvents(runs, out) {
  (out.rounds || (out.rounds = [])).push(out.length);
  for (const r of runs) out.push({ species: SPECIES_NAME[r.spIdx], level: r.level, length: r.len });
}
function maxLevelsToIdx(maxLevels) {
  return [maxLevels.A, maxLevels.B, maxLevels.C, maxLevels.D, 0];
}
// fullResolve と同じ。sp/lv/fl を破壊的に更新する。
function resolveFlat(sp, lv, fl, maxLvByIdx, rng, coefficient, maxRounds, matchCounts, events) {
  const ov = new Uint8Array(SIZE * SIZE);
  let valueDelta = 0; let rounds = 0;
  for (let i = 0; i < maxRounds; i++) {
    const runs = detectRuns(sp, lv, maxLvByIdx);
    if (!runs.length) break;
    matchCounts.push(runs.length);
    valueDelta += runsValueDelta(runs, coefficient);
    if (events) pushEvents(runs, events);
    if (runs.length > 1) runs.sort((a, b) => (b.len - a.len) || (a.ord - b.ord)); // 長い並びから処理する
    ov.fill(0);
    for (const r of runs) mergeRunStandard(r, lv, ov);
    compactFlat(sp, lv);
    fl.fill(0);
    refillFlat(sp, lv, fl, rng);
    rounds++;
  }
  return { rounds, valueDelta };
}
// applySwapMove の中身(平坦配列版)。sp/lv を破壊的に更新する。
function applySwapFlat(sp, lv, idxA, idxB, maxLvByIdx, coefficient, events) {
  const t = sp[idxA]; sp[idxA] = sp[idxB]; sp[idxB] = t;
  const u = lv[idxA]; lv[idxA] = lv[idxB]; lv[idxB] = u;
  const runs = detectRuns(sp, lv, maxLvByIdx);
  if (!runs.length) return { hadMatches: false, directMerge: false, valueDelta: 0 };
  const valueDelta = runsValueDelta(runs, coefficient);
  if (events) pushEvents(runs, events);
  if (runs.length > 1) runs.sort((a, b) => (b.len - a.len) || (a.ord - b.ord)); // 長い並びから処理する
  let directMerge = false;
  const special = []; const standard = [];
  for (const r of runs) {
    const hasA = r.cells.indexOf(idxA) >= 0; const hasB = r.cells.indexOf(idxB) >= 0;
    const swapCreated = hasA !== hasB;
    if (swapCreated) directMerge = true;
    // 入替で直接できた3マッチだけ特別な処理: 動かした側の着地マスに上位ができ、
    // 他は消える。4個以上のマッチは標準の処理のまま。
    if (swapCreated && r.len === 3) special.push({ r, landing: hasA ? idxA : idxB });
    else standard.push(r);
  }
  const ov = new Uint8Array(SIZE * SIZE);
  for (const { r, landing } of special) {
    // 入替で同時に2つの3マッチができると、上位を置く先(動かした駒の着地マス)が取り合いになる。
    // その場合でも2つ目のマッチは成立し、自分の並びの空いているマスに上位ができる
    // (横3つと縦3つが同時に成立 → 5マス使って上位2個)。
    let put = landing;
    if (ov[put]) {
      put = r.cells.find(id => !ov[id]);
      if (put === undefined) continue;   // 並びが全部よそのマッチに使われていたときだけ諦める
    }
    lv[put] = r.level + 1; ov[put] = 1;
    for (const id of r.cells) {
      if (id === put) continue;
      if (!ov[id]) { lv[id] = -1; ov[id] = 1; }
    }
  }
  for (const r of standard) mergeRunStandard(r, lv, ov);
  compactFlat(sp, lv);
  return { hadMatches: true, directMerge, valueDelta };
}

/* --- 盤面(オブジェクトの2次元配列)を受け取り、盤面を返すもの(MAX布陣の起爆の確認で使う) --- */
function fullResolve(grid, maxLevels, rng, coefficient, maxRounds = 14) {
  const sp = new Int8Array(SIZE * SIZE), lv = new Int8Array(SIZE * SIZE), fl = new Uint8Array(SIZE * SIZE);
  flatFromGrid(grid, sp, lv);
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) if (grid[y][x] && grid[y][x].filled) fl[y * SIZE + x] = 1;
  const matchCounts = []; const matchEvents = [];
  const r = resolveFlat(sp, lv, fl, maxLevelsToIdx(maxLevels), rng, coefficient, maxRounds, matchCounts, matchEvents);
  return { grid: gridFromFlat(sp, lv, fl), rounds: r.rounds, matchCounts, valueDelta: r.valueDelta, matchEvents };
}
function simulateSwap(grid, posA, posB, maxLevels, rng, coefficient) {
  const sp = new Int8Array(SIZE * SIZE), lv = new Int8Array(SIZE * SIZE), fl = new Uint8Array(SIZE * SIZE);
  flatFromGrid(grid, sp, lv);
  const maxLvByIdx = maxLevelsToIdx(maxLevels);
  const matchEvents = [];
  const r = applySwapFlat(sp, lv, posA.y * SIZE + posA.x, posB.y * SIZE + posB.x, maxLvByIdx, coefficient, matchEvents);
  let chainMatchCount = 0;
  let valueDelta = r.valueDelta;
  if (r.hadMatches) {
    refillFlat(sp, lv, fl, rng);
    const matchCounts = [];
    const res = resolveFlat(sp, lv, fl, maxLvByIdx, rng, coefficient, 13, matchCounts, matchEvents);
    for (const c of matchCounts) chainMatchCount += c;
    valueDelta += res.valueDelta;
  }
  return { grid: gridFromFlat(sp, lv, fl), directMerge: r.directMerge, hadRandomness: r.hadMatches, chainMatchCount, valueDelta, matchEvents };
}
function simulateDelete(grid, pos, maxLevels, rng, coefficient) {
  const sp = new Int8Array(SIZE * SIZE), lv = new Int8Array(SIZE * SIZE), fl = new Uint8Array(SIZE * SIZE);
  flatFromGrid(grid, sp, lv);
  sp[pos.y * SIZE + pos.x] = -1; lv[pos.y * SIZE + pos.x] = 0;
  compactFlat(sp, lv);
  refillFlat(sp, lv, fl, rng);
  const matchCounts = []; const matchEvents = [];
  const res = resolveFlat(sp, lv, fl, maxLevelsToIdx(maxLevels), rng, coefficient, 13, matchCounts, matchEvents);
  let chainMatchCount = 0;
  for (let i = 1; i < matchCounts.length; i++) chainMatchCount += matchCounts[i];
  return { grid: gridFromFlat(sp, lv, fl), directMerge: false, hadRandomness: true, chainMatchCount, valueDelta: res.valueDelta, matchEvents };
}
/* ============================== 乱数 ============================== */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const rand = mulberry32(seed >>> 0);
  return { pickSpecies: () => SPECIES[Math.floor(rand() * 4)] };
}
function hashString(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return h >>> 0;
}
function levelValue(level, coefficient) {
  return Math.pow(coefficient, level - 1);
}

/* ============================== 盤面の準備・布陣の見本・起爆の確認 ============================== */
function defaultBoard() {
  // 最初の盤面は全部「?」(入力を省いたマス)。入力したマスだけが決まる
  const g = [];
  for (let y = 0; y < SIZE; y++) g.push(Array.from({ length: SIZE }, () => ({ species: '?', level: 1 })));
  return g;
}
// 中身が決まっていないマスを数える。未入力(まだ何も入れていない)と「?」(入力を省いたマス)の2種類
function countUnresolvedCells(board) {
  let empty = 0, unknown = 0;
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
    const c = board[y][x];
    if (!c) empty++;
    else if (!SPECIES.includes(c.species)) unknown++;
  }
  return { empty, unknown, total: empty + unknown };
}
// 未入力のマスを「?」(どの駒ともマッチしない駒)に変える。入れたい所だけ入れて使えるように
function fillEmptyAsUnknown(board) {
  let n = 0;
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
    if (!board[y][x]) { board[y][x] = { species: '?', level: 1 }; n++; }
  }
  return n;
}

    copyRecord(c);
    const rs = c.rs;
    c.avgRec = rs.recSum / rs.samples;
    c.gainAvg = rs.gainSum / rs.samples - c.breakPen;
    c.penAvg = rs.penSum / rs.samples;   // 3個マッチの減点の平均(カードに内訳を出す)
    c.perMove = c.gainAvg / Math.max(1, c.path.length - c.avgRec);
    c.free = c.path.length - c.avgRec <= 0;
  };
  // 手順を補充 '?' で打ったあとの盤面
  const sureBoard = path => {
    let bsp = sp0, blv = lv0;
    for (const m of path) { const r = chainApply(bsp, blv, m, ml, COEF, Q_RNG, null); bsp = r.sp; blv = r.lv; }
    return [bsp, blv];
  };

  /* ---- 素材の一覧(候補を選んで32回ずつ打ち直す) ---- */
  let cands = [];
  if (target) {
    cands = Array.from(finals.values()).sort((p, q) => advanceBetter({ perMove: p.screenPerMove, free: p.screenFree }, { perMove: q.screenPerMove, free: q.screenFree }) || (p.path.length - q.path.length)).slice(0, ADVANCE_REFINE_TOP);
    for (const c of cands) {
      if (!(await tick())) return null;
      c.rs = recordOf(c.path);
      sampleTo(c, CHAIN_REFINE_SAMPLES);
      let bsp = sp0, blv = lv0;
      // 削除する駒の点: 目標でない素材の駒は「レベル − 1.5」(Lv2以上は +、Lv1 は −。高いレベルの駒ほどマッチしにくく、消すのがセオリー)。
      // 何も消さなければ 0、目標の素材を消すなら −10。いちばん点の高い駒で決める
      let junk = 0, deleted = false;
      for (const m of c.path) {
        if (m.type === 'delete') {
          const i = m.pos.y * SIZE + m.pos.x;
          if (bsp[i] === si) { junk = -10; deleted = true; }
          // 2番目以降の布陣の素材は、消しても点を付けない(何も消さないのと同じ)。A3 のために残したいこともあるので、ツールからは消す手を押さない
          else if (junk > -10 && laterSpecies.has(bsp[i])) { junk = deleted ? Math.max(junk, 0) : 0; deleted = true; }
          else if (junk > -10 && bsp[i] >= 0 && bsp[i] <= 3) { junk = deleted ? Math.max(junk, blv[i] - 1.5) : blv[i] - 1.5; deleted = true; }
        }
        const r = chainApply(bsp, blv, m, ml, COEF, Q_RNG, null); bsp = r.sp; blv = r.lv;
      }
      c.junk = junk;
      c.boardKey = placementFlatKey(bsp, blv);
      c.cntSure = addLevelCounts(bsp, blv, new Int16Array(4 * CNT_W));
      // そろったマスを動かした分(手順のあとの盤面。補充は ?)を、素材の増加から引く
      const bp = breakPenaltyOf(aligned, bsp, blv, target);
      c.breakPen = bp.pen; c.breakCells = bp.cells;
      setAdvanceStats(c);
    }
  }

  /* ---- 連鎖の一覧 ---- */
  // 荒い見積りの差し引きの大きい順に ADVANCE_REFINE_TOP 件を、補充 CHAIN_REFINE_SAMPLES 通りで確かめ直す(素材と同じ件数)
  // 素材が減らない手順は、見積りの上位 ADVANCE_REFINE_TOP 件(素材が減る手順を足す前と同じ候補)。
  // 素材が減る手順は、全部の中で上位 ADVANCE_REFINE_TOP 件に入るものだけを足す
  const chainAll = Array.from(chainFinals.values()).sort((p, q) => (q.screenGain - p.screenGain) || (p.path.length - q.path.length));
  const chainCands = chainAll.filter(c => !c.lossy).slice(0, ADVANCE_REFINE_TOP).concat(chainAll.slice(0, ADVANCE_REFINE_TOP).filter(c => c.lossy));
  const setChainStats = c => {
    copyRecord(c);
    const rs = c.rs;
    c.avg = rs.recSum / rs.samples;
    c.avgRec = c.avg;
    c.gain = c.avg - c.path.length;
    if (target) {
      c.penAvg = rs.penSum / rs.samples;
      c.gainAvg = rs.gainSum / rs.samples - c.breakPen;
      c.perMove = c.gainAvg / Math.max(1, c.path.length - c.avg);
    }
  };
  for (const c of chainCands) {
    if (!(await tick())) return null;
    c.rs = recordOf(c.path);
    sampleTo(c, CHAIN_REFINE_SAMPLES);
    // 最後の手が同じ手順は、差し引きが一番大きいものだけ出す(同じ最後の手の前にマッチしない入替を足しただけの手順が上位を埋めないように)
    c.sig = moveKey(c.path[c.path.length - 1]);
    // 手順のあとの盤面(補充は ?)。同じ盤面になる手順は、短いほう(差し引きが大きいほう)だけ出す
    const [bsp, blv] = sureBoard(c.path);
    c.boardKey = placementFlatKey(bsp, blv);
    c.cntSure = addLevelCounts(bsp, blv, new Int16Array(4 * CNT_W));
    if (target) {
      // 1手あたりの素材の増加(素材の一覧と同じ計算。カードに小さく出す)
      const bp = breakPenaltyOf(aligned, bsp, blv, target);
      c.breakPen = bp.pen; c.breakCells = bp.cells;
      // 補充が来なかったときに減る素材(Lv1に直した個数。カードの⚠)。素材が減る連鎖(lossy)だけ。起爆の手順は布陣が役目を終えるので数えない
      c.sureLoss = c.lossy ? Math.max(0, patternCountsFlat(bsp, blv, target).deficit - d0) : 0;
    }
    setChainStats(c);
  }
  // 上位の手順は試す回数を増やして確かめ直す(32通りでは、たまたま多めに出た手順が上に来やすいため)。
  // 素材のタブの並びの上位 ADVANCE_EXTRA_TOP 件と、連鎖のタブの差し引きの上位 CHAIN_EXTRA_TOP 件を、合わせて試し直す。
  // 試した結果は手順ごとに共通なので、どちらかのタブで上位に入った手順は、両方のタブで多く試した数字になる
  const extra = new Set();
  if (target) cands.slice().sort(advanceMaterialOrder).slice(0, ADVANCE_EXTRA_TOP).forEach(c => extra.add(c));
  chainCands.slice().sort((p, q) => (q.gain - p.gain) || (p.path.length - q.path.length)).slice(0, CHAIN_EXTRA_TOP).forEach(c => extra.add(c));
  // 今打っている手順の続きが候補にあれば、続きのカード(continuationCard)と同じ回数だけ試す(一覧と続きのカードで数字をそろえる)
  const cont = grid === state.board ? continuationPath() : null;
  if (cont) { const ck = pathKeyOf(cont); for (const c of cands.concat(chainCands)) if (pathKeyOf(c.path) === ck) extra.add(c); }
  for (const c of extra) {
    if (performance.now() - lastYield > 60) {
      await new Promise(resolve => setTimeout(resolve, 0));
      lastYield = performance.now();
      if (chainAbortRequested) return null;
    }
    sampleTo(c, ADVANCE_EXTRA_SAMPLES);
  }
  // 試し直したあとの数字で、両方の一覧の数字を作り直す
  if (target) cands.forEach(setAdvanceStats);
  chainCands.forEach(setChainStats);

  /* ---- 素材の一覧(並べて、表示する手順を選ぶ) ---- */
  let gainShown = null;
  if (target) {
    // 手順の見込み(補充は ? で、補充1マス = 布陣の色の駒が来る見込み 1/4 個)。32通りの試しと違って運でぶれない。
    // 表示されない手順(変化のない手・MAXの駒の削除・布陣を崩す・最後がくじだけの削除・増えない)は null
    const screenMemo = new Map();
    const screenOfRaw = path => {
      let sp = sp0, lv = lv0, rec = 0, refills = 0, pen = 0;
      for (let j = 0; j < path.length; j++) {
        const m = path[j];
        if (m.type === 'swap') {
          const ia = m.a.y * SIZE + m.a.x, ib = m.b.y * SIZE + m.b.x;
          if (sp[ia] === sp[ib] && lv[ia] === lv[ib]) return null;
        } else if (isMaxPieceAt(sp, lv, m.pos.y * SIZE + m.pos.x, ml)) return null;
        const ev = [];
        const r = chainApply(sp, lv, m, ml, COEF, Q_RNG, ev);
        if (!guard(r.sp, r.lv)) return null;
        // 最後の手は補充が起きること(マッチしない入替で終わらない)。途中のマッチしない入替は駒を動かす手としてよい
        if (j === path.length - 1 && (!r.changed || (m.type === 'delete' && path.length >= 2 && ev.length === 0))) return null;
        sp = r.sp; lv = r.lv; rec += r.rec; refills += r.refills; pen += advancePenalty(ev, target, need);
      }
      rec = Math.min(rec, room);
      const dSure = patternCountsFlat(sp, lv, target).deficit;
      const gain = (d0 - dSure) + Math.min(refills * refillUnit / 4, dSure) - pen - breakPenaltyOf(aligned, sp, lv, target).pen;
      if (gain <= 0) return null;
      return { gain, perMove: gain / Math.max(1, path.length - rec), free: path.length - rec <= 0 };
    };
    const screenOf = path => {
      const key = path.map(moveKey).join(',');
      if (!screenMemo.has(key)) screenMemo.set(key, screenOfRaw(path));
      return screenMemo.get(key);
    };
    // 2手以上の手順は、その中の手を抜き出して(順番はそのまま)今の盤面で打つほうが、見込みが同じか上なら表示しない。
    // 互いに関係のない手を並べただけの手順は、1手ずつ打って補充を見てから次を選ぶほうが得。
    const beatsParts = c => {
      const L = c.path.length;
      if (L < 2) return true;
      const whole = screenOf(c.path);
      if (!whole) return true;
      for (let mask = 1; mask < (1 << L) - 1; mask++) {
        const sub = screenOf(c.path.filter((_, j) => mask & (1 << j)));
        if (!sub) continue;
        if (advanceBetter(sub, whole) <= 1e-9) return false;   // 一部の手だけのほうが、同じか上(同じ並べ方で比べる)
      }
      return true;
    };
    // 素材のタブの並び(手数消費なしが先、そのあと1手あたり)に並べ、結果の盤面が同じ手順は1件だけ出す
    gainShown = [];
    const usedBoard = new Set();
    for (const c of cands.filter(c => c.gainAvg > 0 && beatsParts(c)).sort(advanceMaterialOrder)) {
      if (usedBoard.has(c.boardKey)) continue;
      usedBoard.add(c.boardKey);
      gainShown.push(c);
    }
  }
  // 差し引き(平均の増加 − 使う手数)の大きい順に、マイナスでないものを全部返す。
  // 最後の手も手数も同じ手順と、結果の盤面が同じ手順は、差し引きがいちばん大きい1件だけ出す
  const chainShownList = [];
  {
    const usedSig = new Set(), usedBoard = new Set();
    const bestGain = new Map();   // 最後の手と手数ごとの、素材が減らない連鎖の差し引き
    const byGain = (p, q) => (q.gain - p.gain) || (p.path.length - q.path.length);
    const add = c => {
      const sk = c.sig + '|' + c.path.length + (c.lossy ? '|L' : '');
      if (usedSig.has(sk) || usedBoard.has(c.boardKey)) return;
      usedSig.add(sk); usedBoard.add(c.boardKey);
      chainShownList.push(c);
      if (!c.lossy) bestGain.set(c.sig + '|' + c.path.length, c.gain);
    };
    // 先に素材が減らない連鎖で一覧を作る(前と同じ一覧)。そのあと素材が減る連鎖(lossy)のうち、補充込みの平均で素材が減らないもの
    // (素材の増加が0以上)を足す。最後の手と手数が同じ「素材が減らない連鎖」があるときは、それより手数が多く増えるものだけ(別のカードにする)
    chainCands.filter(c => c.gain >= 0 && !c.lossy).sort(byGain).forEach(add);
    chainCands.filter(c => c.gain >= 0 && c.lossy && c.gainAvg >= 0).sort(byGain)
      .filter(c => !(c.gain <= (bestGain.get(c.sig + '|' + c.path.length) ?? -Infinity))).forEach(add);
    chainShownList.sort(byGain);
  }

  return { gain: gainShown, chain: chainShownList };
}
// 確かめの道具のための入口(これまでの名前のまま)
async function findAdvanceOptions(grid, onProgress) { const r = await findAllOptions(grid, onProgress); return r && r.gain; }
async function findChainOptions(grid, onProgress) { const r = await findAllOptions(grid, onProgress); return r && r.chain; }
// 素材の一覧の並び: 手数消費なし(手数の増加の平均が使う手数以上)の手順を先に、素材の増加の多い順。そのあとは1手あたりの多い順
// (2026-09-28 本人: 手数消費なしを1手ぶんで割って混ぜるのは乱暴。2.0.6 で1本の並びにしたのを戻した)。どれも減点を引いた数字で比べる。
// 見出しの数字(小数点以下1けた)が同じ手順どうしは、連鎖で増える手数(表示の数字)の多い順、それも同じなら
// 目標でない素材の高いレベルの駒を消す手順を先にする(高いレベルの駒はマッチしにくいので消すのがセオリー)
function advanceMaterialOrder(p, q) {
  const key = o => (o.free ? o.gainAvg : o.perMove);
  return ((q.free ? 1 : 0) - (p.free ? 1 : 0))
    || (Number(key(q).toFixed(1)) - Number(key(p).toFixed(1)))
    || (Number(q.avgRec.toFixed(1)) - Number(p.avgRec.toFixed(1)))
    || (q.junk - p.junk)
    || (key(q) - key(p)) || (p.path.length - q.path.length);
}
// 結果のタブ(素材・連鎖)。目標MAX布陣がなければ連鎖だけを出す(タブは出さない)
const RESULT_TABS = [['gain', '素材'], ['chain', '連鎖']];
// もう一方のタブにも同じ手順(打つ手の並びがまったく同じ)があるとき、カードの数字の行の最後に小さく「連鎖のタブにもあります（3番目）」。
// 番号は、もう一方のタブで表示している一覧(絞り込みのあと)の何番目か。renderResults で作り、カードを描くときに使う
let otherTabIndex = null;   // { name: '連鎖', map: Map(手順の鍵 → 番号) }
let cardRank = null;        // いま出しているタブの、手順の鍵 → カードの番号(絞り込みの前の一覧での順番)
const pathKeyOf = path => path.map(m => (m.type === 'swap' ? `s${m.a.x}${m.a.y}${m.b.x}${m.b.y}` : `d${m.pos.x}${m.pos.y}`)).join(',');

let shownResults = null;   // いま出している結果({ res, sec })。「残り◯件を表示」とタブの切り替えで使う
// 絞り込みで選べる素材とレベル: いま目指している布陣と、2番目以降の布陣で使うレベル(「A3」など)
function filterKeys() {
  const ps = currentTargetPattern() ? [currentTargetPattern()].concat(laterTargetPatterns()) : [];
  const keys = [];
  for (const sp of SPECIES) {
    const lv = new Set();
    for (const p of ps) if (p.species === sp) for (const row of p.cells) for (const t of row) if (t !== 'X') lv.add(t);

// いまの絞り込み(なし、または選んだ素材とレベルが今の布陣で使われていなければ null)

// 絞り込みに当たるか: 手順のあとの数(補充は数えない)が n 個以上、または補充も入れた期待値を切り上げた数が n 個以上。

// 「手順を探す」の「絞り込み」の行。布陣を登録していないときは出さない。変えたら、出ている結果をその場で絞り直す(探し直さない)

    <select id="filterKey"><option value="">なし</option>${keys.map(k => `<option value="${k}"${k === cur ? ' selected' : ''}>${esc(pieceLabel(k[0], Number(k.slice(1))))}</option>`).join('')}</select>が
    <select id="filterN"${cur ? '' : ' disabled'}>${Array.from({ length: 20 }, (_, i) => i + 1).map(n => `<option value="${n}"${n === state.resultFilter.n ? ' selected' : ''}>${n}</option>`).join('')}</select>個以上</label>`;

}
function renderResults(res, sec, showAll) {
  shownResults = { res, sec };

  const tab = hasPattern ? state.resultTab : 'chain';

  if (f && !list.length && orig.length) {

  if (hasPattern) {
    chainListEl.insertAdjacentHTML('afterbegin', `<div class="toolbar" style="margin:0 0 8px;align-items:center;">${RESULT_TABS.map(([k, label]) => `<button class="small${tab === k ? ' primary' : ''}" data-result-tab="${k}">${label}</button>`).join('')}</div>`);
    chainListEl.querySelectorAll('[data-result-tab]').forEach(btn => btn.addEventListener('click', () => {
      if (state.resultTab === btn.dataset.resultTab) return;

// 手順のあとの盤面で、新しくそろうマス(今の盤面ではそろっていない、目標MAX布陣の形どおりのマス)。「手順のあと」の盤面に印を付ける

// 盤面を進める手が0件だった理由の文
function advanceEmptyReason() {
  const pattern = currentTargetPattern();
  // 布陣に要る素材が盤面にもうそろっている(足りない素材が0)ときは、増える手はありえない。終盤によくあるので理由を出す
  const fsp = new Int8Array(SIZE * SIZE), flv = new Int8Array(SIZE * SIZE);
  flatFromGrid(state.board, fsp, flv);
  if (patternCountsFlat(fsp, flv, pattern).deficit === 0) return `MAX布陣「${esc(pattern.name)}」に必要な素材は、盤面にもうそろっています。`;
  return `MAX布陣「${esc(pattern.name)}」に必要な素材が増える手順は見つかりませんでした。${advanceLowNote(pattern)}`;
}
// 補充がLv2なのに布陣にLv1のマスがあると、Lv1の不足はどうやっても埋まらないので、0件になりやすい。そのときに足す一言
function advanceLowNote(pattern) {
  let low = 99;
  for (const row of pattern.cells) for (const t of row) if (t !== 'X' && t < low) low = t;
  const refillLv = state.refillLevels[pattern.species] || 1;
  return low < refillLv ? `<br>MAX布陣に${esc(pieceLabel(pattern.species, low))}のマスがありますが、${esc(spLabel(pattern.species))}の補充はLv${refillLv}なので、${esc(pieceLabel(pattern.species, low))}は増えません。MAX布陣のカードの「レベル+1」で合わせてください。` : '';
}
function renderAdvanceOptionsInner(list, sec, showAll) {
  const pattern = currentTargetPattern();

    chainListEl.innerHTML = `<div class="note">${advanceEmptyReason()}（${sec}秒）</div>`;
    chainShown = [];
    return;
  }
  chainShown = list;
  chainShownKind = 'advance';
  const visible = showAll ? list : list.slice(0, CHAIN_SEARCH_SHOW);
  chainListEl.innerHTML = visible.map((o0, idx) => advanceCardHtml(o0, idx)).join('') + (!showAll && list.length > CHAIN_SEARCH_SHOW ? `<div class="toolbar" style="margin:0 0 10px;"><button id="btnChainMore" class="small">残り${list.length - CHAIN_SEARCH_SHOW}件を表示</button></div>` : '') + ``;
  chainListEl.querySelectorAll('[data-chain-apply]').forEach(btn => {
    btn.addEventListener('click', () => startChainSequence(Number(btn.dataset.chainApply)));
  });

// 素材のタブのカード1枚。cont は chainCardHtml と同じ
function advanceCardHtml(o0, idx, cont) {
  const pattern = currentTargetPattern();

  const o = Object.assign({}, o0, chainDetail(state.board, o0.path));
  const info = pathAccidentInfo(state.board, o.path, pattern);

  const recText = ` / 手数の増加 ${o.avgRec.toFixed(1)}手（${o.sureRec}〜${o.bestRec}手）`;
  // 見出しは「素材の増加（1手あたり）(大きく) ／ 差し引き(小さく)」
  const signed = v => (Number(v.toFixed(1)) < 0 ? `−${Math.abs(v).toFixed(1)}` : `+${Math.abs(v).toFixed(1)}`);
  const small = 'font-size:14px;font-weight:700;';
  const gainHead = materialHeadParts(o, o.path.length, o.avgRec);
  const netHead = `差し引き ${signed(o.avgRec - o.path.length)}手`;

  const penParts = [];

  if (o.breakPen > 0) penParts.push(`そろえたマスを動かす −${o.breakPen.toFixed(1)}個`);

  const breakLine = o.breakPen > 0 ? [`そろえたマスを${o.breakCells.length}マス動かします`] : [];

  const headHtml = `<span class="chain-gain">${gainHead.main}</span><span class="chain-gain" style="${small}">${gainHead.paren}</span><span class="chain-meta">／</span><span class="chain-gain" style="${small}">${netHead}</span>`;

    <div class="chain-head">${headHtml}
      <span class="chain-meta head-nums">使う手数 ${o.path.length}${recText}${riskSmall(info)}${cont ? '' : otherTabNote(o)}</span></div>

    ${formationLinesHtml(o.final, o0)}

  </div>`;

/* ============================== 対局の進行(手を打つ・補充を入力する・残り手数) ==============================
 *   1. 最初の盤面と残り手数を入力して「この盤面で始める」

 * 残り手数 = 始めの残り手数 − 打った手数 + 連鎖で増えた手数(入替は入替のあとのマッチすべて、削除は2回目以降のマッチ)。 */
const boardEl = document.getElementById('board');
const brushRowEl = document.getElementById('brushRow');
const gameControlsEl = document.getElementById('gameControls');
let brush = { species: 'A', level: 1 };
let moveMode = 'swap';     // swap / delete / edit(盤面を直す)
let picked = null;         // 入替で1つ目に選んだマス
let targetNotice = '';     // 起爆して次の布陣に移ったときの知らせ(1回だけ出す)
let moveNotice = '';       // 手を打てなかったときの知らせ(次に画面を描くときに1回だけ出す)

function countUnknown(g) { let n = 0; for (const row of g) for (const c of row) if (c && c.species === '?') n++; return n; }
// 補充されたマス(fl が立っているマス)。前からある「?」は含めない
function filledSlots(fl) { const a = []; for (let i = 0; i < SIZE * SIZE; i++) if (fl[i]) a.push({ x: i % SIZE, y: Math.floor(i / SIZE) }); return a; }
// 手を打ったあとも盤面に残る、前からある「?」の数(「?」のマスを削除した手は1つ減る)
function unknownKeptBy(before, move) {
  const n = countUnknown(before);
  if (move.type === 'delete') { const c = before[move.pos.y][move.pos.x]; if (c && c.species === '?') return n - 1; }
  return n;
}
function recoveredTotal() { return state.game.log.reduce((s, e) => s + e.chain, 0); }
// 手数の直し: 盤面を直すときや、確定で計算より少ない数字を入れたときに、ゲーム画面に合わせた分(連鎖による増加とは別に数える)。直前の手にひも付くので「1手戻す」で一緒に戻る
function adjustTotal() { return state.game.log.reduce((s, e) => s + (e.adjust || 0), 0); }
function currentLeft() { const g = state.game; return g.start - g.log.length + recoveredTotal() + adjustTotal(); }
// 残り手数をゲーム画面の数字に直す(手を打つ前なら始めの残り手数を直す)
function setLeftTo(v) {

  if (g.log.length) { const e = g.log[g.log.length - 1]; e.adjust = (e.adjust || 0) + d; }

// 打った手を「動かすところまで」進める。入替は入替でできたマッチまで、削除は消して詰めるまで。直後の補充は「?」。
function applyMoveStep(grid, move) {
  const sp = new Int8Array(SIZE * SIZE), lv = new Int8Array(SIZE * SIZE), fl = new Uint8Array(SIZE * SIZE);
  flatFromGrid(grid, sp, lv);
  const events = [];
  if (move.type === 'swap') {
    applySwapFlat(sp, lv, move.a.y * SIZE + move.a.x, move.b.y * SIZE + move.b.x, maxLevelsToIdx(state.maxLevels), COEF, events);
  } else {
    const i = move.pos.y * SIZE + move.pos.x;
    sp[i] = -1; lv[i] = 0;
    compactFlat(sp, lv);
  }
  refillFlat(sp, lv, fl, Q_RNG);

// マッチを1ラウンドだけ進める(補充は「?」)。補充された駒が次のマッチに絡むので、ラウンドごとに色を聞く必要がある。

  const sp = new Int8Array(SIZE * SIZE), lv = new Int8Array(SIZE * SIZE), fl = new Uint8Array(SIZE * SIZE);
  flatFromGrid(grid, sp, lv);
  const matchCounts = [], matchEvents = [];
  const r = resolveFlat(sp, lv, fl, maxLevelsToIdx(state.maxLevels), Q_RNG, COEF, 1, matchCounts, matchEvents);
  return { grid: cloneGrid(gridFromFlat(sp, lv, fl)), rounds: r.rounds, matches: matchCounts[0] || 0, events: matchEvents, slots: filledSlots(fl) };

// この手で新しく補充されて、まだ入力されていないマスの数。

function pendingInputCount(p) {
  let empty = 0;
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) if (!state.board[y][x]) empty++;
  if (!p) return empty;
  return empty + Math.max(0, countUnknown(state.board) - (p.unknownBefore || 0));

// pinsBefore: 「ピンを外して打つ」で外す前のピン(1手戻したときに戻すため)
function playMove(move, riskChecked, pinChecked, pinsBefore) {
  const g = state.game;
  if (g.phase !== 'move') return;
  if (g.future.length) { withFutureDropped(() => playMove(move, riskChecked, pinChecked, pinsBefore)); return; }
  // ピンの駒が動く手(入替・削除でピンの駒そのものを動かす手と、補充を ? として確実にピンの駒が消える・詰まって動く手)は、打つ前に確かめる。
  // 打つなら、動くピンは外してから打つ
  if (!pinChecked) {
    const moved = pinsMovedBy(move);
    if (moved.length) {
      const to = g.pinTo || {};
      const destOnly = moved.every(i => to[i] != null);
      openAsk(destOnly ? 'この手を打つと、行き先付きのピンの駒がマッチするか、行き先から離れます。ピンを外して打ちますか？' : 'この手を打つと、ピンの駒がマッチするか、動きます。ピンを外して打ちますか？', {
        okLabel: 'ピンを外して打つ',
        onOk: () => { const before = currentPins(); g.pins = before.filter(i => !moved.includes(i)); playMove(move, riskChecked, true, before); },

  // (試す補充の並びが違うだけで、1手目では出ずに3手目で出ることがあるため)
  const target = currentTargetPattern();

    const info = pathAccidentInfo(state.board, [move], target, false);   // 自分で打つ手は、ピンの駒を動かしてもよい
    if (info.sureNames.length || info.risk >= ACCIDENT_WARN) {

  const queueBefore = { queue: JSON.parse(JSON.stringify(g.queue)), total: g.queueTotal, card: g.queueCard || null, pins: (pinsBefore || currentPins()).slice(), pinTo: Object.assign({}, g.pinTo || {}), pinNum: Object.assign({}, g.pinNum || {}) };

  // 手が確定したとき(commitMove・commitFinal)に消して、今の盤面のカードに切り替える。練習モードは入力がないので、すぐ消す
  if (g.practice) clearChainResults();

  if (g.practice) { playPracticeMove(move, before, queueBefore); return; }

    const s = resolveSure(before, move);

// 補充を「?」(どの駒ともマッチしない)として、補充された駒が絡まないマッチを最後まで進める。そこまでに増える手数も数える。
function resolveSure(grid, move) {
  const sp = new Int8Array(SIZE * SIZE), lv = new Int8Array(SIZE * SIZE), fl = new Uint8Array(SIZE * SIZE);
  flatFromGrid(grid, sp, lv);
  const ml = maxLevelsToIdx(state.maxLevels);

  let rec = 0;
  if (move.type === 'swap') {
    const r = applySwapFlat(sp, lv, move.a.y * SIZE + move.a.x, move.b.y * SIZE + move.b.x, ml, COEF, events);

// 入力間違いの確認: 入力した盤面が、この手を打ってありえるかを調べる。

//   ok=false … ありえない。diff はいちばん近いありえる盤面と違うマス(idx の配列。近い盤面が何通りもあれば、その全部の違うマス)、reason は 'board'(盤面が違う)/ 'rec'(盤面は合うが増えた手数が違う)

  // 補充の色を決めて、本当の計算で打ち直す。入力した盤面・増えた手数と合えば true
  function replay(colors) {
    const sp = new Int8Array(N), lv = new Int8Array(N), fl = new Uint8Array(N);

    let k = 0;
    const rng = { pickSpecies: () => SPECIES_NAME[k < colors.length ? colors[k++] : 0] };
    const counts = [];
    let r = 0;
    if (move.type === 'swap') {
      const m = applySwapFlat(sp, lv, move.a.y * SIZE + move.a.x, move.b.y * SIZE + move.b.x, ml, 1, null);
      if (m.hadMatches) {
        refillFlat(sp, lv, fl, rng);

        counts.forEach((c, i) => { r += c * recoveryWeight(i + 2); });
      }

      refillFlat(sp, lv, fl, rng);

  function compactWithId(sp, lv, id, ch) {
